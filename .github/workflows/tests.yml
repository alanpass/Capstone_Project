name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      # 前端邏輯、Edge Function、資料庫 schema（PGlite）一次測完
      - run: deno test --allow-read --allow-env --allow-net --allow-sys tests/ supabase/
