<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>註冊帳號｜園藝智能助理</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500&family=Noto+Serif+TC:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css"/>

  <style>
    /* --- 基礎變數 --- */
    :root {
      --primary-color: #4A6352; /* 深森林綠 */
      --accent-color: #84A588; /* 鼠尾草綠 */
      --light-bg: #F7F6F2; /* 米白紙質感 */
      --text-dark: #3D3D3D;
      --card-radius: 20px;
      --shadow: 0 10px 30px rgba(74, 99, 82, 0.15);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Noto Sans TC', sans-serif;
      background-color: var(--light-bg);
      color: var(--text-dark);
      width: 100%;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow-x: hidden;
    }

    /* 背景紋理 */
    body::before {
      content: "";
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background-image: url("image/backgroud.jpg");
      background-size: cover;
      background-position: center;
      opacity: 0.1;
      z-index: -5;
    }

    /* 飄落葉子動畫 */
    .falling-leaf {
      position: fixed;
      top: -10%;
      z-index: -2;
      opacity: 0.2;
      color: var(--primary-color);
      animation: fall linear infinite;
      pointer-events: none;
    }

    @keyframes fall {
      0% { transform: translateY(-10vh) rotate(0deg) translateX(0); opacity: 0; }
      20% { opacity: 0.3; }
      100% { transform: translateY(110vh) rotate(360deg) translateX(50px); opacity: 0; }
    }
    .l1 { left: 10%; font-size: 30px; animation-duration: 15s; }
    .l2 { left: 50%; font-size: 25px; animation-duration: 20s; animation-delay: 5s; }
    .l3 { left: 90%; font-size: 35px; animation-duration: 18s; animation-delay: 2s; }

    /* --- Header --- */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 40px;
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(10px);
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 2px 15px rgba(0,0,0,0.05);
    }

    .logo-container {
      display: flex; align-items: center; text-decoration: none;
      color: var(--primary-color); transition: opacity 0.3s;
    }
    .logo-container:hover { opacity: 0.8; }

    .logo { width: 50px; height: 50px; border-radius: 50%; object-fit: cover; }
    
    .logo-text {
      font-family: 'Noto Serif TC', serif;
      font-size: 26px; margin-left: 15px; font-weight: 700;
      letter-spacing: 1px; color: var(--primary-color);
    }

    .nav { display: flex; gap: 35px; align-items: center; }

    .nav-item {
      text-decoration: none; color: var(--text-dark);
      font-size: 16px; font-weight: 500; position: relative;
      transition: color 0.3s;
    }
    .nav-item:hover { color: var(--primary-color); }

    .login-btn {
      background-color: var(--primary-color); color: white; border: none;
      padding: 10px 24px; border-radius: 50px; font-size: 16px;
      cursor: pointer; transition: all 0.3s ease;
      box-shadow: 0 4px 10px rgba(74, 99, 82, 0.3);
    }
    .login-btn:hover {
      background-color: #3a4f41; transform: translateY(-2px);
    }

    /* --- Content Area --- */
    .main-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }

    /* 註冊卡片 (玻璃擬態) */
    .register-card {
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(20px);
      border-radius: var(--card-radius);
      padding: 40px 50px;
      width: 100%;
      max-width: 600px;
      box-shadow: var(--shadow);
      border: 1px solid rgba(255, 255, 255, 0.8);
      position: relative;
      overflow: hidden;
    }

    /* 頂部裝飾線 */
    .register-card::before {
      content: "";
      position: absolute;
      top: 0; left: 0; width: 100%; height: 6px;
      background: linear-gradient(90deg, var(--accent-color), var(--primary-color));
    }

    .card-title {
      font-family: 'Noto Serif TC', serif;
      font-size: 28px;
      color: var(--primary-color);
      text-align: center;
      margin-bottom: 30px;
      font-weight: 700;
    }

    /* 表單樣式 */
    .form-group { margin-bottom: 20px; text-align: left; }

    .form-label {
      display: block;
      font-size: 14px;
      color: #666;
      margin-bottom: 8px;
      font-weight: 500;
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-icon {
      position: absolute;
      left: 15px;
      color: var(--accent-color);
      font-size: 18px;
    }

    .form-input {
      width: 100%;
      padding: 15px 15px 15px 45px;
      font-size: 16px;
      border: 1px solid #ddd;
      border-radius: 12px;
      background: #fdfdfd;
      outline: none;
      transition: all 0.3s;
      color: var(--text-dark);
    }

    .form-input:focus {
      border-color: var(--accent-color);
      box-shadow: 0 0 0 3px rgba(132, 165, 136, 0.2);
      background: white;
    }

    /* 按鈕區域 */
    .submit-row {
      display: flex;
      gap: 15px;
      margin-top: 30px;
    }

    .submit-btn {
      flex: 2;
      background: linear-gradient(135deg, var(--accent-color), var(--primary-color));
      color: white;
      border: none;
      padding: 15px;
      border-radius: 12px;
      font-size: 18px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.3s;
      box-shadow: 0 5px 15px rgba(74, 99, 82, 0.2);
    }

    .submit-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(74, 99, 82, 0.3);
    }

    .back-btn {
      flex: 1;
      background: white;
      color: var(--primary-color);
      border: 1px solid var(--accent-color);
      padding: 15px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.3s;
    }

    .back-btn:hover {
      background: #f0f7f2;
    }

    .err {
      margin-top: 20px;
      color: #D9534F;
      font-weight: 500;
      text-align: center;
      min-height: 24px;
      font-size: 14px;
      background: rgba(217, 83, 79, 0.1);
      border-radius: 8px;
      padding: 5px;
      opacity: 0;
      transition: opacity 0.3s;
    }
    .err.show { opacity: 1; }

    @media (max-width: 768px) {
      .header { flex-direction: column; padding: 15px; gap: 15px; }
      .register-card { padding: 30px 20px; }
      .submit-row { flex-direction: column; }
    }
  </style>
</head>
<body>
  <i class="fas fa-leaf falling-leaf l1"></i>
  <i class="fas fa-leaf falling-leaf l2"></i>
  <i class="fas fa-leaf falling-leaf l3"></i>

  <header class="header">
    <a href="firstpagelog.html" class="logo-container" aria-label="返回首頁">
      <img src="https://placehold.co/60x60/4A6352/white?text=Leaf" alt="Leaf logo" class="logo" />
      <div class="logo-text">園藝智能助理</div>
    </a>
    <nav class="nav">
      <a class="nav-item" href="#">開始種植</a>
      <a class="nav-item" href="#">使用者資訊</a>
      <button class="login-btn" onclick="location.href='login.html'">登入</button>
    </nav>
  </header>

  <main class="main-content">
    <div class="register-card">
      <h1 class="card-title">建立新帳號</h1>

      <div class="form-container">
        <div class="form-group">
          <label for="name" class="form-label">姓名</label>
          <div class="input-wrapper">
            <i class="fas fa-user input-icon"></i>
            <input type="text" id="name" class="form-input" placeholder="請輸入您的姓名" required/>
          </div>
        </div>

        <div class="form-group">
          <label for="email" class="form-label">電子信箱</label>
          <div class="input-wrapper">
            <i class="fas fa-envelope input-icon"></i>
            <input type="email" id="email" class="form-input" placeholder="name@example.com" required/>
          </div>
        </div>

        <div class="form-group">
          <label for="password" class="form-label">設定密碼</label>
          <div class="input-wrapper">
            <i class="fas fa-lock input-icon"></i>
            <input type="password" id="password" class="form-input" placeholder="至少6位數" required/>
          </div>
        </div>

        <div class="form-group">
          <label for="address" class="form-label">居住地址</label>
          <div class="input-wrapper">
            <i class="fas fa-home input-icon"></i>
            <input type="text" id="address" class="form-input" placeholder="用於推薦適合的植物" required/>
          </div>
        </div>

        <div class="submit-row">
          <button class="submit-btn" id="regBtn">註冊帳號</button>
          <button class="back-btn" onclick="location.href='login.html'">返回登入</button>
        </div>

        <div id="err" class="err"></div>
      </div>
    </div>
  </main>

  <script type="module">
    import { signUpWithProfile } from './common.js';

    const btn = document.getElementById('regBtn');
    const err = document.getElementById('err');

    btn?.addEventListener('click', async (e) => {
      e.preventDefault();
      err.textContent = '';
      err.classList.remove('show');

      const name = document.getElementById('name')?.value?.trim() || '';
      const email = document.getElementById('email')?.value?.trim() || '';
      const password = document.getElementById('password')?.value || '';
      const address = document.getElementById('address')?.value?.trim() || '';

      if (!name || !email || !password || !address) {
        err.textContent = '⚠ 請填寫所有欄位';
        err.classList.add('show');
        return;
      }
      
      if (password.length < 6) {
        err.textContent = '⚠ 密碼長度需至少 6 位數';
        err.classList.add('show');
        return;
      }

      const originalText = btn.innerHTML;
      btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> 註冊中...';
      btn.disabled = true;

      try {
        await signUpWithProfile({ name, email, password, address });
        alert('🎉 註冊成功！請使用剛剛設定的帳密登入');
        location.href = 'login.html';
      } catch (e) {
        console.error(e);
        err.classList.add('show');
        if (e.code === 'auth/email-already-in-use') {
          err.textContent = '此信箱已被註冊過，請直接登入';
        } else if (e.code === 'auth/invalid-email') {
          err.textContent = '信箱格式不正確';
        } else {
          err.textContent = e?.message || '註冊失敗，請稍後再試';
        }
        
        btn.innerHTML = originalText;
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
