<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>使用者資訊｜園藝智能助理</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&family=Noto+Serif+TC:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" />
  
  <style>
    /* --- 基礎變數 (莫蘭迪綠色系) --- */
    :root {
      --primary-color: #4A6352; /* 深森林綠 */
      --accent-color: #84A588; /* 鼠尾草綠 */
      --light-bg: #F7F6F2; /* 米白紙質感 */
      --text-dark: #3D3D3D;
      --card-radius: 20px;
      --shadow: 0 10px 30px rgba(74, 99, 82, 0.15);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Noto Sans TC', sans-serif;
      background-color: var(--light-bg);
      color: var(--text-dark);
      width: 100%;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow-x: hidden;
    }

    /* 背景紋理 */
    body::before {
      content: "";
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background-image: url("image/backgroud.jpg"); 
      background-size: cover;
      background-position: center;
      opacity: 0.1;
      z-index: -5;
    }

    /* 飄落葉子動畫 */
    .falling-leaf {
      position: fixed;
      top: -10%;
      z-index: -2;
      opacity: 0.2;
      color: var(--primary-color);
      animation: fall linear infinite;
      pointer-events: none;
    }
    @keyframes fall {
      0% { transform: translateY(-10vh) rotate(0deg) translateX(0); opacity: 0; }
      20% { opacity: 0.3; }
      100% { transform: translateY(110vh) rotate(360deg) translateX(50px); opacity: 0; }
    }
    .l1 { left: 10%; font-size: 28px; animation-duration: 15s; }
    .l2 { left: 80%; font-size: 24px; animation-duration: 18s; animation-delay: 2s; }

    /* --- Header 導覽列 --- */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 40px;
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(10px);
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 2px 15px rgba(0,0,0,0.05);
    }

    .logo-container {
      display: flex; align-items: center; text-decoration: none;
      color: var(--primary-color); transition: opacity 0.3s;
    }
    .logo-container:hover { opacity: 0.8; }

    .logo { width: 50px; height: 50px; border-radius: 50%; object-fit: cover; }
    
    .logo-text {
      font-family: 'Noto Serif TC', serif;
      font-size: 26px; margin-left: 15px; font-weight: 700;
      letter-spacing: 1px; color: var(--primary-color);
    }

    .nav { display: flex; gap: 35px; align-items: center; }

    .nav-item {
      text-decoration: none; color: var(--text-dark);
      font-size: 16px; font-weight: 500; position: relative;
      transition: color 0.3s;
    }
    .nav-item:hover { color: var(--primary-color); }

    .login-btn {
      background-color: var(--primary-color); color: white; border: none;
      padding: 10px 24px; border-radius: 50px; font-size: 16px;
      cursor: pointer; transition: all 0.3s ease;
      box-shadow: 0 4px 10px rgba(74, 99, 82, 0.3);
    }
    .login-btn:hover {
      background-color: #3a4f41; transform: translateY(-2px);
    }

    /* --- Content Area --- */
    .main-content {
      flex: 1;
      width: 100%;
      max-width: 1100px;
      margin: 0 auto;
      padding: 40px 20px;
    }

    /* --- 1. 個人資料卡片 (與 login.html 風格一致) --- */
    .profile-card {
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(20px);
      border-radius: var(--card-radius);
      padding: 40px;
      box-shadow: var(--shadow);
      border: 1px solid rgba(255, 255, 255, 0.8);
      margin-bottom: 50px;
      position: relative;
      overflow: hidden;
    }

    /* 頂部裝飾線 */
    .profile-card::before {
      content: ""; position: absolute; top: 0; left: 0; width: 100%; height: 6px;
      background: linear-gradient(90deg, var(--accent-color), var(--primary-color));
    }

    .section-title {
      font-family: 'Noto Serif TC', serif;
      font-size: 28px;
      color: var(--primary-color);
      margin-bottom: 30px;
      font-weight: 700;
      display: flex; align-items: center; gap: 10px;
    }

    .info-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 20px;
      margin-bottom: 30px;
    }

    /* 資訊小方塊 */
    .info-box {
      background: #fdfdfd;
      border: 1px solid #eee;
      border-radius: 12px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      transition: transform 0.3s;
    }
    .info-box:hover { transform: translateY(-3px); box-shadow: 0 5px 15px rgba(0,0,0,0.05); }

    .info-label {
      font-size: 13px; color: #888; margin-bottom: 5px; font-weight: 500;
      display: flex; align-items: center; gap: 5px;
    }
    .info-value {
      font-size: 18px; font-weight: 600; color: var(--text-dark);
      word-break: break-all;
    }

    /* 修改資料按鈕 */
    .edit-btn {
      display: inline-flex; justify-content: center; align-items: center; gap: 8px;
      background: linear-gradient(135deg, var(--accent-color), var(--primary-color));
      color: white; text-decoration: none;
      padding: 12px 30px; border-radius: 50px;
      font-size: 16px; font-weight: 500;
      box-shadow: 0 4px 10px rgba(74, 99, 82, 0.2);
      transition: all 0.3s;
    }
    .edit-btn:hover {
      transform: translateY(-2px); box-shadow: 0 6px 15px rgba(74, 99, 82, 0.3);
    }

    /* --- 2. 植物花園區塊 --- */
    .plants-header {
      font-family: 'Noto Serif TC', serif;
      font-size: 30px;
      color: var(--primary-color);
      margin-bottom: 25px;
      font-weight: 700;
      text-align: center;
      text-shadow: 0 2px 15px rgba(255,255,255,0.8);
    }

    .plant-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 30px;
    }

    /* 植物卡片 (Glassmorphism) */
    .plant-card {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      border-radius: var(--card-radius);
      padding: 25px;
      box-shadow: var(--shadow);
      border: 1px solid rgba(255, 255, 255, 0.6);
      transition: all 0.3s ease;
      position: relative;
      display: flex;
      flex-direction: column;
    }
    .plant-card:hover {
      transform: translateY(-8px);
      box-shadow: 0 15px 35px rgba(74, 99, 82, 0.2);
    }

    /* 狀態標籤 */
    .status-badge {
      position: absolute; top: 20px; right: 20px;
      background: #EDF3EF; color: var(--primary-color);
      padding: 5px 12px; border-radius: 20px;
      font-size: 13px; font-weight: 600;
    }

    .plant-name {
      font-family: 'Noto Serif TC', serif;
      font-size: 24px; color: var(--primary-color);
      font-weight: 700; margin-bottom: 5px;
    }

    .plant-stage {
      display: inline-block;
      font-size: 14px; color: white;
      background: var(--accent-color);
      padding: 3px 10px; border-radius: 6px;
      margin-bottom: 15px;
    }

    .meta-row {
      display: flex; justify-content: space-between;
      font-size: 14px; color: #666; margin-bottom: 8px;
    }

    /* 進度條 */
    .progress-container {
      height: 8px; background: #e0e0e0;
      border-radius: 4px; overflow: hidden;
      margin-top: 5px; margin-bottom: 20px;
    }
    .progress-bar {
      height: 100%;
      background: linear-gradient(90deg, var(--accent-color), var(--primary-color));
      border-radius: 4px;
    }

    /* 按鈕群組 */
    .action-row {
      margin-top: auto;
      display: flex; gap: 10px;
    }

    .card-btn {
      border: none; padding: 10px; border-radius: 10px;
      font-size: 14px; font-weight: 600; cursor: pointer;
      transition: all 0.3s; display: flex; align-items: center; justify-content: center; gap: 5px;
    }

    .btn-ai {
      flex: 2;
      background: white; color: var(--primary-color);
      border: 1px solid var(--primary-color);
    }
    .btn-ai:hover { background: #f0f7f2; }

    .btn-del {
      flex: 1;
      background: #fff5f5; color: #c62828;
      border: 1px solid #ffcdd2;
    }
    .btn-del:hover { background: #ffebee; }

    /* AI 回覆區 (深色終端機風格) */
    .ai-result {
      margin-top: 15px; padding: 15px;
      background: #2C3E36; /* 深墨綠 */
      color: #E0ECD3;      /* 淺綠文字 */
      border-radius: 10px;
      font-family: monospace; font-size: 14px; line-height: 1.6;
      display: none;
      white-space: pre-wrap;
      animation: fadeIn 0.5s;
    }
    @keyframes fadeIn { from{opacity:0;transform:translateY(5px);} to{opacity:1;transform:translateY(0);} }

    footer { text-align: center; color: #888; margin-top: 40px; font-size: 14px; }

    /* RWD */
    @media (max-width: 768px) {
      .header { flex-direction: column; padding: 15px; gap: 15px; }
      .info-grid { grid-template-columns: 1fr; }
    }
  </style></head><body>
  <i class="fas fa-leaf falling-leaf l1"></i>
  <i class="fas fa-leaf falling-leaf l2"></i>

  <header class="header">
    <a href="firstpage.html" class="logo-container" aria-label="返回首頁">
      <img src="https://placehold.co/60x60/4A6352/white?text=Leaf" alt="Leaf logo" class="logo" />
      <div class="logo-text">園藝智能助理</div>
    </a>
    <nav class="nav">
      <a href="new.html" class="nav-item">開始種植</a>
      <a href="userinfor.html" class="nav-item" style="color:var(--primary-color); font-weight:bold;">使用者資訊</a>
      <a href="hardware.html" class="nav-item">感測器資訊</a>
      <button class="login-btn" id="logoutBtn">登出</button>
    </nav>
  </header>

  <main class="main-content">
    
    <div class="profile-card">
      <h2 class="section-title"><i class="fas fa-id-card-alt"></i> 個人檔案</h2>
      
      <div class="info-grid">
        <div class="info-box">
          <span class="info-label"><i class="fas fa-user"></i> 姓名</span>
          <span class="info-value" id="displayName">載入中...</span>
        </div>
        <div class="info-box">
          <span class="info-label"><i class="fas fa-envelope"></i> 電子郵件</span>
          <span class="info-value" id="email" style="font-size:16px;">載入中...</span>
        </div>
        <div class="info-box">
          <span class="info-label"><i class="fas fa-map-marker-alt"></i> 居住地址</span>
          <span class="info-value" id="address">載入中...</span>
        </div>
      </div>

      <div style="text-align: center;">
        <a href="revise.html" class="edit-btn"><i class="fas fa-pen"></i> 修改個人資料</a>
      </div>
    </div>

    <h2 class="plants-header"><i class="fas fa-seedling"></i> 我的植物花園</h2>
    <div id="plantGrid" class="plant-grid">
      <div style="grid-column:1/-1; text-align:center; padding:40px; color:#666; background:rgba(255,255,255,0.6); border-radius:20px;">
        <i class="fas fa-spinner fa-spin"></i> 載入資料中...
      </div>
    </div>

  </main>

  <footer>© 2025 Horticulture Assistant</footer>

  <script type="module">
    import { db } from './common.js';
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";
    import { doc, getDoc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

    const auth = getAuth();
    const nameEl = document.getElementById('displayName');
    const emailEl = document.getElementById('email');
    const addrEl = document.getElementById('address');
    const logoutBtn = document.getElementById('logoutBtn');
    
    // 🚨 Render 後端網址
    const CLOUD_RUN_URL = "https://two025-zhuan-ti.onrender.com";

    // 1. 登入與個資
    onAuthStateChanged(auth, async (user) => {
      if (!user) { location.href = 'login.html'; return; }

      emailEl.textContent = user.email || '（未提供）';
      const ref = doc(db, 'users', user.uid);
      
      try {
        const snap = await getDoc(ref);
        if (!snap.exists()) {
            await setDoc(ref, { displayName: user.displayName || '', address: '', createdAt: serverTimestamp() }, { merge: true });
            nameEl.textContent = user.displayName || '（未設定）';
            addrEl.textContent = '（未設定）';
        } else {
            const d = snap.data();
            nameEl.textContent = d.displayName || user.displayName || '（未設定）';
            addrEl.textContent = d.address || '（未設定）';
        }
      } catch (e) {
          console.error("讀取使用者資料錯誤:", e);
      }

      // 2. 載入植物列表
      loadUserPlants(user.uid);
    });

    logoutBtn.addEventListener('click', async () => {
      if(confirm('確定要登出嗎？')) {
        await signOut(auth);
        location.href = 'login.html';
      }
    });

    // 3. 植物列表邏輯
    async function loadUserPlants(userId) {
        const grid = document.getElementById('plantGrid');
        try {
            const res = await fetch(`${CLOUD_RUN_URL}/get-my-plants?user_id=${userId}`);
            const data = await res.json();
            
            grid.innerHTML = ''; 
            
            if (!data.success || data.plants.length === 0) {
                grid.innerHTML = `
                    <div style="grid-column:1/-1; text-align:center; background: rgba(255,255,255,0.9); padding: 40px; border-radius: 20px;">
                        <i class="fas fa-leaf" style="font-size: 40px; color: #84A588; margin-bottom: 15px;"></i>
                        <h3 style="color:#4A6352; margin-bottom:10px;">您的花園目前是空的</h3>
                        <p style="color:#666; margin-bottom:20px;">快去建立您的第一個種植計畫吧！</p>
                        <a href="new.html" class="edit-btn" style="display:inline-block;">前往種植</a>
                    </div>`;
                return;
            }

            data.plants.forEach((plant, index) => {
                const card = document.createElement('div');
                card.className = 'plant-card';
                const plantDataStr = encodeURIComponent(JSON.stringify(plant));
                
                card.innerHTML = `
                    <div class="status-badge">第 ${plant.current_day} 天</div>
                    <div class="plant-name">${plant.plant_name}</div>
                    <div><span class="plant-stage">${plant.current_stage}</span></div>
                    
                    <div class="meta-row">
                        <span><i class="far fa-calendar"></i> ${plant.start_date}</span>
                        <span>總計 ${plant.total_days} 天</span>
                    </div>
                    
                    <div class="progress-container">
                        <div class="progress-bar" style="width: ${plant.progress}%"></div>
                    </div>
                    
                    <div class="action-row">
                        <button class="card-btn btn-ai" onclick="askAI('${plantDataStr}', 'res-${index}')">
                            <i class="fas fa-robot"></i> 今日任務
                        </button>
                        <button class="card-btn btn-del" onclick="deletePlant('${plant.id}')" title="刪除">
                            <i class="fas fa-trash-alt"></i>
                        </button>
                    </div>
                    
                    <div id="res-${index}" class="ai-result"></div>
                `;
                grid.appendChild(card);
            });

        } catch (e) {
            grid.innerHTML = `<div style="grid-column:1/-1; color:#c62828; background:#ffebee; padding:15px; border-radius:10px; text-align:center;"> 無法載入植物: ${e.message}</div>`;
        }
    }
    window.deletePlant = async function(plantId) {
        if (!confirm("確定要刪除這株植物嗎？此動作無法復原。")) return;
        
        const user = auth.currentUser;
        if (!user) { alert("請先登入"); return; }
        const userId = user.uid;

        try {
            const res = await fetch(`${CLOUD_RUN_URL}/delete-plant`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ user_id: userId, plant_id: plantId })
            });
            
            const data = await res.json();
            if (data.success) {
                loadUserPlants(userId); // 重新整理列表
            } else {
                throw new Error(data.error || '刪除失敗');
            }
        } catch (e) {
            alert(`❌ 錯誤: ${e.message}`);
        }
    }

    // 4. AI 分析邏輯 (已修正去除星號)
    window.askAI = async function(plantDataStr, resId) {
        const resDiv = document.getElementById(resId);
        
        const plant = JSON.parse(decodeURIComponent(plantDataStr));
        const today = new Date().toISOString().split('T')[0];
        
        resDiv.style.display = 'block';
        resDiv.innerHTML = ' 正在思考中...';

        try {
            let envInfo = "";
            try {
                const userId = auth.currentUser.uid;
                const wRes = await fetch(`${CLOUD_RUN_URL}/get-address?user_id=${userId}`);
                const wData = await wRes.json();
                if(wData.weather) envInfo += `天氣:${wData.weather.天氣},溫度:${wData.weather.溫度範圍} `;
                
                const sRes = await fetch(`${CLOUD_RUN_URL}/get-sensor`);
                const sData = await sRes.json();
                if(sData.length > 0) envInfo += `土壤濕度:${sData[0].土壤濕度}%`;
            } catch(e) { console.error('Sensor error', e); }

            // ✅ 修改指令：明確要求不使用星號
            const prompt = `
我是農業顧問。
作物: ${plant.plant_name}
種植天數: 第 ${plant.current_day} 天
目前階段: ${plant.current_stage}
環境數據: ${envInfo}

請根據以上資訊，給出 3 項今日的具體照護任務。
請直接列出任務，不要有前言或結語。
請不要使用 Markdown 格式或星號(*)，請使用純文字列表。
每項任務請簡短扼要。
`.trim();
            
            const aiRes = await fetch(`${CLOUD_RUN_URL}/call-gemini-proxy`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ prompt: prompt })
            });
            
            if (!aiRes.ok) throw new Error(`API 錯誤 ${aiRes.status}`);

            const aiData = await aiRes.json();
            let aiTasks = aiData.result ? aiData.result.trim() : "無法生成建議";

            // ✅ 強制移除所有星號和粗體標記，確保乾淨
            aiTasks = aiTasks.replace(/\*\*/g, '').replace(/\*/g, '');

            const formattedOutput = `🌱 作物: ${plant.plant_name}\n📆 日期: ${today}\n📊 進度: ${plant.progress}%\n\n[今日任務建議]:\n${aiTasks}`;

            resDiv.textContent = formattedOutput;

        } catch (err) {
            resDiv.textContent = ` 分析失敗: ${err.message}`;
        }
    }
  </script></body></html>
