<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>登入｜園藝智能助理</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500&family=Noto+Serif+TC:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" />
  
  <style>
    /* --- 基礎變數 --- */
    :root {
      --primary-color: #4A6352; /* 深森林綠 */
      --accent-color: #84A588; /* 鼠尾草綠 */
      --light-bg: #F7F6F2; /* 米白紙質感 */
      --text-dark: #3D3D3D;
      --card-radius: 20px;
      --shadow: 0 10px 30px rgba(74, 99, 82, 0.15);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Noto Sans TC', sans-serif;
      background-color: var(--light-bg);
      color: var(--text-dark);
      width: 100%;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow-x: hidden;
    }

    /* 背景紋理 */
    body::before {
      content: "";
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background-image: url("image/backgroud.jpg");
      background-size: cover;
      background-position: center;
      opacity: 0.1;
      z-index: -5;
    }

    /* 飄落葉子動畫 */
    .falling-leaf {
      position: fixed;
      top: -10%;
      z-index: -2;
      opacity: 0.2;
      color: var(--primary-color);
      animation: fall linear infinite;
      pointer-events: none;
    }

    @keyframes fall {
      0% { transform: translateY(-10vh) rotate(0deg) translateX(0); opacity: 0; }
      20% { opacity: 0.3; }
      100% { transform: translateY(110vh) rotate(360deg) translateX(50px); opacity: 0; }
    }
    .l1 { left: 15%; font-size: 28px; animation-duration: 14s; }
    .l2 { left: 85%; font-size: 24px; animation-duration: 18s; animation-delay: 2s; }
    .l3 { left: 50%; font-size: 32px; animation-duration: 22s; animation-delay: 7s; }

    /* --- Header --- */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 40px;
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(10px);
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 2px 15px rgba(0,0,0,0.05);
    }

    .logo-container {
      display: flex; align-items: center; text-decoration: none;
      color: var(--primary-color); transition: opacity 0.3s;
    }
    .logo-container:hover { opacity: 0.8; }

    .logo { width: 50px; height: 50px; border-radius: 50%; object-fit: cover; }
    
    .logo-text {
      font-family: 'Noto Serif TC', serif;
      font-size: 26px; margin-left: 15px; font-weight: 700;
      letter-spacing: 1px; color: var(--primary-color);
    }

    .nav { display: flex; gap: 35px; align-items: center; }

    .nav-item {
      text-decoration: none; color: var(--text-dark);
      font-size: 16px; font-weight: 500; position: relative;
      transition: color 0.3s;
    }
    .nav-item:hover { color: var(--primary-color); }

    /* --- Content Area --- */
    .main-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }

    /* 登入卡片 (玻璃擬態) */
    .login-card {
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(20px);
      border-radius: var(--card-radius);
      padding: 50px 40px;
      width: 100%;
      max-width: 480px;
      box-shadow: var(--shadow);
      border: 1px solid rgba(255, 255, 255, 0.8);
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    /* 頂部裝飾線 */
    .login-card::before {
      content: "";
      position: absolute;
      top: 0; left: 0; width: 100%; height: 6px;
      background: linear-gradient(90deg, var(--accent-color), var(--primary-color));
    }

    .card-title {
      font-family: 'Noto Serif TC', serif;
      font-size: 32px;
      color: var(--primary-color);
      margin-bottom: 10px;
      font-weight: 700;
    }

    .card-subtitle {
      color: #666;
      font-size: 16px;
      margin-bottom: 40px;
    }

    /* 表單樣式 */
    .login-form { width: 100%; }

    .form-group { margin-bottom: 25px; text-align: left; }

    .form-label {
      display: block;
      font-size: 14px;
      color: #666;
      margin-bottom: 8px;
      font-weight: 500;
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-icon {
      position: absolute;
      left: 15px;
      color: var(--accent-color);
      font-size: 18px;
    }

    .form-input {
      width: 100%;
      padding: 15px 15px 15px 45px;
      font-size: 16px;
      border: 1px solid #ddd;
      border-radius: 12px;
      background: #fdfdfd;
      outline: none;
      transition: all 0.3s;
      color: var(--text-dark);
    }

    .form-input:focus {
      border-color: var(--accent-color);
      box-shadow: 0 0 0 3px rgba(132, 165, 136, 0.2);
      background: white;
    }

    /* 按鈕區域 */
    .submit-btn {
      width: 100%;
      background: linear-gradient(135deg, var(--accent-color), var(--primary-color));
      color: white;
      border: none;
      padding: 15px;
      border-radius: 12px;
      font-size: 18px;
      font-weight: 500;
      cursor: pointer;
      margin-top: 10px;
      transition: all 0.3s;
      box-shadow: 0 5px 15px rgba(74, 99, 82, 0.2);
    }

    .submit-btn:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(74, 99, 82, 0.3);
    }
    
    .submit-btn:disabled {
      background: #ccc;
      cursor: wait;
    }

    .action-links {
      display: flex;
      justify-content: space-between;
      margin-top: 25px;
      font-size: 14px;
    }

    .text-btn {
      background: none;
      border: none;
      color: var(--primary-color);
      cursor: pointer;
      font-size: 15px;
      font-weight: 500;
      text-decoration: none;
      transition: color 0.3s;
      padding: 0;
    }
    .text-btn:hover { color: var(--accent-color); text-decoration: underline; }

    .err {
      margin-top: 20px;
      color: #D9534F;
      font-weight: 500;
      text-align: center;
      min-height: 24px;
      font-size: 14px;
      background: rgba(217, 83, 79, 0.1);
      border-radius: 8px;
      padding: 5px;
      opacity: 0; /* 預設隱藏 */
      transition: opacity 0.3s;
    }
    .err.show { opacity: 1; }

    @media (max-width: 768px) {
      .header { flex-direction: column; padding: 15px; gap: 15px; }
      .login-card { padding: 30px 20px; }
    }
  </style>
</head>
<body>
  <i class="fas fa-leaf falling-leaf l1"></i>
  <i class="fas fa-leaf falling-leaf l2"></i>
  <i class="fas fa-leaf falling-leaf l3"></i>

  <header class="header">
    <a href="firstpagelog.html" class="logo-container" aria-label="返回首頁">
      <img src="https://placehold.co/60x60/4A6352/white?text=Leaf" alt="Leaf logo" class="logo" />
      <div class="logo-text">園藝智能助理</div>
    </a>
    <nav class="nav">
      <a href="firstpagelog.html" class="nav-item">開始種植</a>
      <a href="userinfor.html" class="nav-item">使用者資訊</a>
    </nav>
  </header>

  <main class="main-content">
    <div class="login-card">
      <h1 class="card-title">歡迎回來</h1>
      <p class="card-subtitle">請登入您的帳戶以管理植物</p>

      <form class="login-form" id="loginForm">
        <div class="form-group">
          <label class="form-label">電子信箱</label>
          <div class="input-wrapper">
            <i class="fas fa-envelope input-icon"></i>
            <input type="email" class="form-input" id="email" autocomplete="email" inputmode="email" placeholder="name@example.com" required />
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">密碼</label>
          <div class="input-wrapper">
            <i class="fas fa-lock input-icon"></i>
            <input type="password" class="form-input" id="password" autocomplete="current-password" placeholder="請輸入密碼" required />
          </div>
        </div>

        <button type="submit" class="submit-btn" id="loginBtn">登入</button>
        
        <div class="action-links">
          <button type="button" class="text-btn" onclick="window.location.href='forget.html'">忘記密碼?</button>
          <span>還沒有帳號? <button type="button" class="text-btn" onclick="window.location.href='register.html'">立即註冊</button></span>
        </div>

        <div id="err" class="err"></div>
      </form>
    </div>
  </main>

  <script type="module">
    import { signInEmail, checkLoginRedirect } from './common.js';

    // 已登入者直接導向登入後首頁
    checkLoginRedirect('firstpage.html');

    const form = document.getElementById('loginForm');
    const btn  = document.getElementById('loginBtn');
    const err  = document.getElementById('err');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      err.textContent = '';
      err.classList.remove('show');

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value.trim();
      
      if (!email || !password) {
        err.textContent = '請輸入帳號與密碼！';
        err.classList.add('show');
        return;
      }

      const originalBtnText = btn.textContent;
      btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> 登入中...';
      btn.disabled = true;

      try {
        await signInEmail(email, password);
        // 登入成功
        location.href = 'firstpage.html';
      } catch (error) {
        console.error(error);
        err.classList.add('show');
        if (error && error.code === 'auth/invalid-credential') {
          err.textContent = '帳號或密碼錯誤';
        } else if (error && error.code === 'auth/user-not-found') {
          err.textContent = '找不到此使用者，請先註冊';
        } else if (error && error.code === 'auth/wrong-password') {
          err.textContent = '密碼錯誤';
        } else {
          err.textContent = error?.message || '登入失敗，請稍後再試。';
        }
        
        // 恢復按鈕
        btn.textContent = originalBtnText;
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
