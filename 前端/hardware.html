<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>感測器資訊｜園藝智能助理</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500&family=Noto+Serif+TC:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" />
  
  <style>
    /* --- 基礎變數 --- */
    :root {
      --primary-color: #4A6352; /* 深森林綠 */
      --accent-color: #84A588; /* 鼠尾草綠 */
      --light-bg: #F7F6F2; /* 米白紙質感 */
      --text-dark: #3D3D3D;
      --card-radius: 20px;
      --shadow: 0 10px 30px rgba(74, 99, 82, 0.1);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Noto Sans TC', sans-serif;
      background-color: var(--light-bg);
      color: var(--text-dark);
      width: 100%;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow-x: hidden;
    }

    /* 背景紋理 */
    body::before {
      content: "";
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background-image: url("image/backgroud.jpg");
      background-size: cover;
      background-position: center;
      opacity: 0.1;
      z-index: -5;
    }

    /* 飄落葉子動畫 */
    .falling-leaf {
      position: fixed;
      top: -10%;
      z-index: -2;
      opacity: 0.2;
      color: var(--primary-color);
      animation: fall linear infinite;
      pointer-events: none;
    }

    @keyframes fall {
      0% { transform: translateY(-10vh) rotate(0deg) translateX(0); opacity: 0; }
      20% { opacity: 0.3; }
      100% { transform: translateY(110vh) rotate(360deg) translateX(50px); opacity: 0; }
    }
    .l1 { left: 5%; font-size: 25px; animation-duration: 18s; }
    .l2 { left: 50%; font-size: 30px; animation-duration: 22s; animation-delay: 3s; }
    .l3 { left: 90%; font-size: 20px; animation-duration: 15s; animation-delay: 7s; }

    /* --- Header --- */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 40px;
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(10px);
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 2px 15px rgba(0,0,0,0.05);
    }

    .logo-container {
      display: flex; align-items: center; text-decoration: none;
      color: var(--primary-color); transition: opacity 0.3s;
    }
    .logo-container:hover { opacity: 0.8; }

    .logo { width: 50px; height: 50px; border-radius: 50%; object-fit: cover; }
    
    .logo-text {
      font-family: 'Noto Serif TC', serif;
      font-size: 26px; margin-left: 15px; font-weight: 700;
      letter-spacing: 1px; color: var(--primary-color);
    }

    .nav { display: flex; gap: 35px; align-items: center; }

    .nav-item {
      text-decoration: none; color: var(--text-dark);
      font-size: 16px; font-weight: 500; position: relative;
      transition: color 0.3s;
    }
    .nav-item:hover { color: var(--primary-color); }

    .login-btn {
      background-color: var(--primary-color); color: white; border: none;
      padding: 10px 24px; border-radius: 50px; font-size: 16px;
      cursor: pointer; transition: all 0.3s ease;
      box-shadow: 0 4px 10px rgba(74, 99, 82, 0.3);
    }
    .login-btn:hover {
      background-color: #3a4f41; transform: translateY(-2px);
    }

    /* --- Content Area --- */
    main {
      flex: 1;
      max-width: 1200px;
      width: 100%;
      margin: 0 auto;
      padding: 40px 20px;
    }

    .page-header {
      text-align: center;
      margin-bottom: 40px;
    }

    .page-title {
      font-family: 'Noto Serif TC', serif;
      font-size: 32px;
      color: var(--primary-color);
      font-weight: 700;
      margin-bottom: 10px;
    }
    
    .page-subtitle {
      color: #666;
      font-size: 16px;
    }

    /* Grid Layout */
    .grid {
      display: grid;
      gap: 30px;
      grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
    }

    /* 圖表卡片 */
    .chart-card {
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(15px);
      border-radius: var(--card-radius);
      box-shadow: var(--shadow);
      border: 1px solid rgba(255, 255, 255, 0.8);
      overflow: hidden;
      transition: all 0.3s ease;
      display: flex;
      flex-direction: column;
    }

    .chart-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 15px 35px rgba(74, 99, 82, 0.15);
    }

    .card-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 15px 20px;
      background: linear-gradient(to right, rgba(237, 243, 239, 0.5), transparent);
      border-bottom: 1px solid #eee;
    }

    .chart-title {
      font-family: 'Noto Serif TC', serif;
      font-weight: 700;
      color: var(--primary-color);
      font-size: 18px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .chart-title i {
    position: relative;
    top: 2px;      /* 往下 3px，覺得還不夠可以改成 4px 或 5px */
    }

    .badge {
      font-size: 12px;
      background: var(--accent-color);
      color: white;
      padding: 4px 10px;
      border-radius: 20px;
      font-weight: 500;
      letter-spacing: 0.5px;
    }

    .iframe-container {
      padding: 10px;
      flex: 1;
      background: white;
    }

    iframe {
      width: 100%;
      height: 400px; /* 稍微調整高度，使其更緊湊 */
      border: none;
      border-radius: 10px;
      display: block;
    }

    /* Footer */
    footer {
      text-align: center;
      color: #888;
      font-size: 14px;
      padding: 30px 0;
      margin-top: auto;
    }

    @media (max-width: 768px) {
      .header { flex-direction: column; padding: 15px; gap: 15px; }
      .grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <i class="fas fa-leaf falling-leaf l1"></i>
  <i class="fas fa-leaf falling-leaf l2"></i>
  <i class="fas fa-leaf falling-leaf l3"></i>

  <header class="header">
    <a href="firstpage.html" class="logo-container" aria-label="返回首頁">
      <img src="https://placehold.co/60x60/4A6352/white?text=Leaf" alt="Leaf logo" class="logo" />
      <div class="logo-text">園藝智能助理</div>
    </a>
    <nav class="nav">
      <a href="new.html" class="nav-item">開始種植</a>
      <a href="userinfor.html" class="nav-item">使用者資訊</a>
      <button class="login-btn" id="logoutBtn">登出</button>
    </nav>
  </header>

  <main>
    <div class="page-header">
      <h1 class="page-title"><i class="fas fa-chart-line"></i> 感測器即時數據</h1>
      <p class="page-subtitle">即時監控環境數值，掌握植物生長狀態</p>
    </div>

    <div class="grid">
      <div class="chart-card">
        <div class="card-head">
          <div class="chart-title"> 感測數據 1 (土壤濕度)</div>
          <span class="badge">Live</span>
        </div>
        <div class="iframe-container">
          <iframe src="https://thingspeak.com/channels/3013983/charts/1?bgcolor=%23ffffff&color=%234A6352&dynamic=true&results=60&type=line&update=15"></iframe>
        </div>
      </div>

      <div class="chart-card">
        <div class="card-head">
          <div class="chart-title"> 感測數據 2 (空氣溫度)</div>
          <span class="badge">Live</span>
        </div>
        <div class="iframe-container">
          <iframe src="https://thingspeak.com/channels/3013983/charts/2?bgcolor=%23ffffff&color=%234A6352&dynamic=true&results=60&type=line&update=15"></iframe>
        </div>
      </div>

      <div class="chart-card">
        <div class="card-head">
          <div class="chart-title"> 感測數據 3 (空氣濕度)</div>
          <span class="badge">Live</span>
        </div>
        <div class="iframe-container">
          <iframe src="https://thingspeak.com/channels/3013983/charts/3?bgcolor=%23ffffff&color=%234A6352&dynamic=true&results=60&type=line&update=15"></iframe>
        </div>
      </div>
    </div>
  </main>

  <footer>
    &copy; 2025 園藝智能助理 Horticulture Assistant
  </footer>

  <script type="module">
    import { auth, requireAuth } from './common.js';
    import { signOut } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js"; // 確保版本號一致

    requireAuth('login.html'); // 未登入者導回登入頁

    const logoutBtn = document.getElementById('logoutBtn');
    logoutBtn.addEventListener('click', async () => {
      try {
        await signOut(auth);
        alert('已登出');
        window.location.href = 'login.html';
      } catch (error) {
        console.error('登出失敗', error);
      }
    });
  </script>
</body>
</html>
