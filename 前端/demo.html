<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>設定環境參數｜園藝智能助理</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500&family=Noto+Serif+TC:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" />
  
  <style>
    /* --- 基礎變數 (與前頁一致) --- */
    :root {
      --primary-color: #4A6352; /* 深森林綠 */
      --accent-color: #84A588; /* 鼠尾草綠 */
      --light-bg: #F7F6F2; /* 米白紙質感 */
      --text-dark: #3D3D3D;
      --card-radius: 20px;
      --shadow: 0 10px 30px rgba(74, 99, 82, 0.1);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Noto Sans TC', sans-serif;
      background-color: var(--light-bg);
      color: var(--text-dark);
      width: 100%;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow-x: hidden;
    }

    /* 背景紋理 */
    body::before {
      content: "";
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background-image: url("image/backgroud.jpg");
      background-size: cover;
      background-position: center;
      opacity: 0.1;
      z-index: -5;
    }

    /* 飄落葉子動畫 */
    .falling-leaf {
      position: fixed;
      top: -10%;
      z-index: -2;
      opacity: 0.2;
      color: var(--primary-color);
      animation: fall linear infinite;
      pointer-events: none;
    }

    @keyframes fall {
      0% { transform: translateY(-10vh) rotate(0deg) translateX(0); opacity: 0; }
      20% { opacity: 0.3; }
      100% { transform: translateY(110vh) rotate(360deg) translateX(50px); opacity: 0; }
    }
    .l1 { left: 10%; font-size: 30px; animation-duration: 15s; }
    .l2 { left: 80%; font-size: 25px; animation-duration: 22s; animation-delay: 5s; }

    /* --- Header (保持一致) --- */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 40px;
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(10px);
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 2px 15px rgba(0,0,0,0.05);
    }

    .logo-container {
      display: flex; align-items: center; text-decoration: none;
      color: var(--primary-color); transition: opacity 0.3s;
    }
    .logo-container:hover { opacity: 0.8; }

    .logo { width: 50px; height: 50px; border-radius: 50%; object-fit: cover; }
    
    .logo-text {
      font-family: 'Noto Serif TC', serif;
      font-size: 26px; margin-left: 15px; font-weight: 700;
      letter-spacing: 1px; color: var(--primary-color);
    }

    .nav { display: flex; gap: 35px; align-items: center; }

    .nav-item {
      text-decoration: none; color: var(--text-dark);
      font-size: 16px; font-weight: 500; position: relative;
      transition: color 0.3s;
    }
    .nav-item:hover { color: var(--primary-color); }

    .login-btn {
      background-color: var(--primary-color); color: white; border: none;
      padding: 10px 24px; border-radius: 50px; font-size: 16px;
      cursor: pointer; transition: all 0.3s ease;
      box-shadow: 0 4px 10px rgba(74, 99, 82, 0.3);
    }
    .login-btn:hover {
      background-color: #3a4f41; transform: translateY(-2px);
    }

    /* --- Content Area --- */
    .main-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }

    /* 玻璃擬態卡片容器 */
    .form-card {
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(15px);
      border-radius: var(--card-radius);
      padding: 40px 50px;
      width: 100%;
      max-width: 550px;
      box-shadow: var(--shadow);
      border: 1px solid rgba(255, 255, 255, 0.8);
      position: relative;
      overflow: hidden;
    }

    /* 頂部裝飾條 */
    .form-card::before {
      content: "";
      position: absolute;
      top: 0; left: 0; width: 100%; height: 6px;
      background: linear-gradient(90deg, var(--accent-color), var(--primary-color));
    }

    .page-title {
      font-family: 'Noto Serif TC', serif;
      font-size: 28px;
      color: var(--primary-color);
      text-align: center;
      margin-bottom: 30px;
      font-weight: 700;
    }
    .page-title i { margin-right: 10px; color: var(--accent-color); }

    /* 表單樣式優化 */
    .form-container { width: 100%; }

    .form-group {
      margin-bottom: 25px;
      position: relative;
    }

    .form-label {
      display: block;
      font-size: 16px;
      color: #666;
      margin-bottom: 8px;
      font-weight: 500;
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-icon {
      position: absolute;
      left: 15px;
      color: var(--accent-color);
      font-size: 18px;
    }

    .form-input {
      width: 100%;
      padding: 15px 15px 15px 45px; /* 留位置給 Icon */
      font-size: 18px;
      border: 1px solid #ddd;
      border-radius: 10px;
      background: #fdfdfd;
      outline: none;
      transition: all 0.3s;
      color: var(--primary-color);
      font-weight: bold;
    }

    .form-input:focus {
      border-color: var(--accent-color);
      box-shadow: 0 0 0 3px rgba(132, 165, 136, 0.2);
      background: white;
    }

    /* 分隔線 */
    .divider {
      height: 1px;
      background: #eee;
      margin: 10px 0 25px 0;
    }

    /* 按鈕樣式 */
    .submit-btn {
      width: 100%;
      background: linear-gradient(135deg, var(--accent-color), var(--primary-color));
      color: white;
      border: none;
      padding: 16px;
      border-radius: 12px;
      font-size: 18px;
      font-weight: 500;
      cursor: pointer;
      margin-top: 10px;
      transition: all 0.3s;
      box-shadow: 0 5px 15px rgba(74, 99, 82, 0.2);
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
    }

    .submit-btn:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(74, 99, 82, 0.3);
    }

    .submit-btn:disabled {
      background: #ccc;
      cursor: not-allowed;
      box-shadow: none;
    }

    .msg {
      margin-top: 20px;
      color: var(--primary-color);
      font-weight: 500;
      text-align: center;
      min-height: 24px;
      font-size: 15px;
    }

    @media (max-width: 768px) {
      .header { flex-direction: column; padding: 15px; gap: 15px; }
      .nav { gap: 15px; flex-wrap: wrap; justify-content: center; }
      .form-card { padding: 30px 20px; }
    }
  </style>
</head>

<body>
  <i class="fas fa-leaf falling-leaf l1"></i>
  <i class="fas fa-leaf falling-leaf l2"></i>

  <header class="header">
    <a href="firstpage.html" class="logo-container" aria-label="返回首頁">
      <img src="https://placehold.co/60x60/4A6352/white?text=Leaf" alt="Leaf logo" class="logo" />
      <div class="logo-text">園藝智能助理</div>
    </a>
    
    <nav class="nav">
      <a href="new.html" class="nav-item">開始種植</a>
      <a href="userinfor.html" class="nav-item">使用者資訊</a>
      <button class="login-btn" id="logoutBtn">登出</button>
    </nav>
  </header>

  <main class="main-content">
    <div class="form-card">
      <div class="page-title"><i class="fas fa-sliders-h"></i> 設定環境參數</div>

      <form class="form-container">
        <div class="form-group">
          <label class="form-label">溫度上限 (°C)</label>
          <div class="input-wrapper">
            <i class="fas fa-temperature-high input-icon"></i>
            <input type="number" id="tempMax" class="form-input" placeholder="例如: 30" required />
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">溫度下限 (°C)</label>
          <div class="input-wrapper">
            <i class="fas fa-temperature-low input-icon"></i>
            <input type="number" id="tempMin" class="form-input" placeholder="例如: 15" required />
          </div>
        </div>

        <div class="divider"></div>

        <div class="form-group">
          <label class="form-label">濕度上限</label>
          <div class="input-wrapper">
            <i class="fas fa-tint input-icon"></i>
            <input type="number" id="humidMax" class="form-input" placeholder="例如: 80" required />
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">濕度下限</label>
          <div class="input-wrapper">
            <i class="fas fa-tint-slash input-icon"></i>
            <input type="number" id="humidMin" class="form-input" placeholder="例如: 40" required />
          </div>
        </div>

        <button type="button" class="submit-btn" id="resetBtn">
          <i class="fas fa-save"></i> 確認修改設定
        </button>
        <div id="msg" class="msg"></div>
      </form>
    </div>
  </main>

  <script type="module">
    import { db, doLogout } from './common.js'; // 假設您有統一的 doLogout
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";
    import { doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

    const auth = getAuth();

    const tempMaxEl  = document.getElementById("tempMax");
    const tempMinEl  = document.getElementById("tempMin");
    const humidMaxEl = document.getElementById("humidMax");
    const humidMinEl = document.getElementById("humidMin");
    const msgEl      = document.getElementById("msg");
    const btn        = document.getElementById("resetBtn");
    const logoutBtn  = document.getElementById("logoutBtn");

    // 登出按鈕邏輯
    logoutBtn.addEventListener('click', async () => {
       try {
         // 如果 common.js 裡有 doLogout 函式
         if (typeof doLogout === 'function') {
            await doLogout();
         } else {
            // 後備方案
            await auth.signOut();
         }
         alert('已登出');
         location.href = 'login.html';
       } catch (e) {
         console.error(e);
         location.href = 'login.html';
       }
    });

    onAuthStateChanged(auth, async (user) => {
      if (!user) {
        msgEl.innerHTML = "<i class='fas fa-exclamation-circle'></i> 請先登入再設定溫度濕度";
        msgEl.style.color = "#d9534f";
        btn.disabled = true;
        // 幾秒後跳轉回登入頁，視需求開啟
        // setTimeout(() => location.href='login.html', 2000);
        return;
      }

      btn.disabled = false;

      // thresholds/{uid}
      const ref = doc(db, "thresholds", user.uid);

      // 進頁面先讀舊設定
      try {
        const snap = await getDoc(ref);
        if (snap.exists()) {
          const data = snap.data();
          if (data.tempMax  !== undefined) tempMaxEl.value  = data.tempMax;
          if (data.tempMin  !== undefined) tempMinEl.value  = data.tempMin;
          if (data.humidMax !== undefined) humidMaxEl.value = data.humidMax;
          if (data.humidMin !== undefined) humidMinEl.value = data.humidMin;
        }
      } catch (e) {
        console.error("讀取設定失敗", e);
        msgEl.textContent = "⚠ 讀取現有設定失敗";
        msgEl.style.color = "#d9534f";
      }

      // 按下「確認修改」→ 寫回 Firestore
      btn.addEventListener("click", async () => {
        // 加入 loading 狀態
        const originalBtnText = btn.innerHTML;
        btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> 儲存中...';
        btn.disabled = true;

        const tempMax  = Number(tempMaxEl.value);
        const tempMin  = Number(tempMinEl.value);
        const humidMax = Number(humidMaxEl.value);
        const humidMin = Number(humidMinEl.value);

        if (
          Number.isNaN(tempMax)  ||
          Number.isNaN(tempMin)  ||
          Number.isNaN(humidMax) ||
          Number.isNaN(humidMin)
        ) {
          msgEl.textContent = "⚠ 請填寫所有欄位（數字）";
          msgEl.style.color = "#d9534f";
          btn.innerHTML = originalBtnText;
          btn.disabled = false;
          return;
        }

        if (tempMin > tempMax) {
          msgEl.textContent = "⚠ 溫度下限不能大於上限";
          msgEl.style.color = "#d9534f";
          btn.innerHTML = originalBtnText;
          btn.disabled = false;
          return;
        }
        if (humidMin > humidMax) {
          msgEl.textContent = "⚠ 濕度下限不能大於上限";
          msgEl.style.color = "#d9534f";
          btn.innerHTML = originalBtnText;
          btn.disabled = false;
          return;
        }

        try {
          await setDoc(
            ref,
            {
              tempMax,
              tempMin,
              humidMax,
              humidMin,
              updatedAt: new Date()
            },
            { merge: true }
          );
          msgEl.innerHTML = "<i class='fas fa-check-circle'></i> 設定已成功儲存！";
          msgEl.style.color = "var(--primary-color)";
        } catch (e) {
          console.error("寫入設定失敗", e);
          msgEl.textContent = "❌ 儲存失敗，請稍後再試";
          msgEl.style.color = "#d9534f";
        } finally {
          btn.innerHTML = originalBtnText;
          btn.disabled = false;
        }
      });
    });
  </script>
</body>
</html>
