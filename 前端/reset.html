<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>重設密碼｜園藝智能助理</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500&family=Noto+Serif+TC:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" />
  
  <style>
    /* --- 基礎變數 --- */
    :root {
      --primary-color: #4A6352; /* 深森林綠 */
      --accent-color: #84A588; /* 鼠尾草綠 */
      --light-bg: #F7F6F2; /* 米白紙質感 */
      --text-dark: #3D3D3D;
      --card-radius: 20px;
      --shadow: 0 10px 30px rgba(74, 99, 82, 0.15);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Noto Sans TC', sans-serif;
      background-color: var(--light-bg);
      color: var(--text-dark);
      width: 100%;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow-x: hidden;
    }

    /* 背景紋理 */
    body::before {
      content: "";
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background-image: url("image/backgroud.jpg");
      background-size: cover;
      background-position: center;
      opacity: 0.1;
      z-index: -5;
    }

    /* 飄落葉子動畫 */
    .falling-leaf {
      position: fixed;
      top: -10%;
      z-index: -2;
      opacity: 0.2;
      color: var(--primary-color);
      animation: fall linear infinite;
      pointer-events: none;
    }

    @keyframes fall {
      0% { transform: translateY(-10vh) rotate(0deg) translateX(0); opacity: 0; }
      20% { opacity: 0.3; }
      100% { transform: translateY(110vh) rotate(360deg) translateX(50px); opacity: 0; }
    }
    .l1 { left: 15%; font-size: 28px; animation-duration: 14s; }
    .l2 { left: 60%; font-size: 24px; animation-duration: 18s; animation-delay: 2s; }
    .l3 { left: 90%; font-size: 32px; animation-duration: 22s; animation-delay: 5s; }

    /* --- Header --- */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 40px;
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(10px);
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 2px 15px rgba(0,0,0,0.05);
    }

    .logo-container {
      display: flex; align-items: center; text-decoration: none;
      color: var(--primary-color); transition: opacity 0.3s;
    }
    .logo-container:hover { opacity: 0.8; }

    .logo { width: 50px; height: 50px; border-radius: 50%; object-fit: cover; }
    
    .logo-text {
      font-family: 'Noto Serif TC', serif;
      font-size: 26px; margin-left: 15px; font-weight: 700;
      letter-spacing: 1px; color: var(--primary-color);
    }

    .nav { display: flex; gap: 35px; align-items: center; }

    .nav-item {
      text-decoration: none; color: var(--text-dark);
      font-size: 16px; font-weight: 500; position: relative;
      transition: color 0.3s;
    }
    .nav-item:hover { color: var(--primary-color); }

    .login-btn {
      background-color: var(--primary-color); color: white; border: none;
      padding: 10px 24px; border-radius: 50px; font-size: 16px;
      cursor: pointer; transition: all 0.3s ease;
      box-shadow: 0 4px 10px rgba(74, 99, 82, 0.3);
    }
    .login-btn:hover {
      background-color: #3a4f41; transform: translateY(-2px);
    }

    /* --- Content Area --- */
    .main-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }

    /* 重設密碼卡片 (玻璃擬態) */
    .reset-card {
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(20px);
      border-radius: var(--card-radius);
      padding: 40px 50px;
      width: 100%;
      max-width: 500px;
      box-shadow: var(--shadow);
      border: 1px solid rgba(255, 255, 255, 0.8);
      position: relative;
      overflow: hidden;
      text-align: center;
    }

    /* 頂部裝飾線 */
    .reset-card::before {
      content: "";
      position: absolute;
      top: 0; left: 0; width: 100%; height: 6px;
      background: linear-gradient(90deg, var(--accent-color), var(--primary-color));
    }

    .card-title {
      font-family: 'Noto Serif TC', serif;
      font-size: 28px;
      color: var(--primary-color);
      margin-bottom: 25px;
      font-weight: 700;
    }

    /* 表單樣式 */
    .form-container { width: 100%; }

    .form-group { margin-bottom: 25px; text-align: left; }

    .form-label {
      display: block;
      font-size: 14px;
      color: #666;
      margin-bottom: 8px;
      font-weight: 500;
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-icon {
      position: absolute;
      left: 15px;
      color: var(--accent-color);
      font-size: 18px;
    }

    .form-input {
      width: 100%;
      padding: 15px 15px 15px 45px;
      font-size: 16px;
      border: 1px solid #ddd;
      border-radius: 12px;
      background: #fdfdfd;
      outline: none;
      transition: all 0.3s;
      color: var(--text-dark);
    }

    .form-input:focus {
      border-color: var(--accent-color);
      box-shadow: 0 0 0 3px rgba(132, 165, 136, 0.2);
      background: white;
    }

    /* 按鈕 */
    .submit-btn {
      width: 100%;
      background: linear-gradient(135deg, var(--accent-color), var(--primary-color));
      color: white;
      border: none;
      padding: 15px;
      border-radius: 12px;
      font-size: 18px;
      font-weight: 500;
      cursor: pointer;
      margin-top: 10px;
      transition: all 0.3s;
      box-shadow: 0 5px 15px rgba(74, 99, 82, 0.2);
    }

    .submit-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(74, 99, 82, 0.3);
    }

    .msg {
      margin-top: 20px;
      color: var(--primary-color);
      font-weight: 500;
      text-align: center;
      min-height: 24px;
      font-size: 14px;
    }

    @media (max-width: 768px) {
      .header { flex-direction: column; padding: 15px; gap: 15px; }
      .reset-card { padding: 30px 20px; }
    }
  </style>
</head>
<body>
  <i class="fas fa-leaf falling-leaf l1"></i>
  <i class="fas fa-leaf falling-leaf l2"></i>
  <i class="fas fa-leaf falling-leaf l3"></i>

  <header class="header">
    <a href="firstpage.html" class="logo-container" aria-label="返回首頁">
      <img src="https://placehold.co/60x60/4A6352/white?text=Leaf" alt="Leaf logo" class="logo" />
      <div class="logo-text">園藝智能助理</div>
    </a>
    <nav class="nav">
      <a href="new.html" class="nav-item">開始種植</a>
      <a href="userinfor.html" class="nav-item">使用者資訊</a>
      <button class="login-btn" onclick="location.href='login.html'">登入</button>
    </nav>
  </header>

  <main class="main-content">
    <div class="reset-card">
      <h1 class="card-title">設定新密碼</h1>

      <form class="form-container">
        <div class="form-group">
          <label class="form-label">輸入新密碼</label>
          <div class="input-wrapper">
            <i class="fas fa-lock input-icon"></i>
            <input type="password" id="newPassword" class="form-input" placeholder="至少6位數" required />
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">確認新密碼</label>
          <div class="input-wrapper">
            <i class="fas fa-check-circle input-icon"></i>
            <input type="password" id="confirmPassword" class="form-input" placeholder="再次輸入密碼" required />
          </div>
        </div>

        <button type="button" class="submit-btn" id="resetBtn">確認修改</button>
        <div id="msg" class="msg"></div>
      </form>
    </div>
  </main>

  <script type="module">
    import { confirmResetPassword } from './common.js';

    const btn = document.getElementById('resetBtn');
    const msg = document.getElementById('msg');

    btn.addEventListener('click', async (e) => {
      e.preventDefault();
      msg.textContent = '';
      msg.style.color = 'var(--primary-color)';

      const newPassword = document.getElementById('newPassword').value.trim();
      const confirmPassword = document.getElementById('confirmPassword').value.trim();

      if (!newPassword || !confirmPassword) {
        msg.textContent = '⚠ 請填寫所有欄位';
        msg.style.color = '#D9534F';
        return;
      }
      if (newPassword.length < 6) {
        msg.textContent = '⚠ 密碼長度需至少 6 位數';
        msg.style.color = '#D9534F';
        return;
      }
      if (newPassword !== confirmPassword) {
        msg.textContent = '⚠ 兩次密碼輸入不一致';
        msg.style.color = '#D9534F';
        return;
      }

      // 按鈕 loading 狀態
      const originalText = btn.innerHTML;
      btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> 更新中...';
      btn.disabled = true;

      try {
        const params = new URLSearchParams(window.location.search);
        const oobCode = params.get('oobCode');
        if (!oobCode) throw new Error('連結無效或已過期，請重新申請');

        await confirmResetPassword(oobCode, newPassword);
        
        msg.innerHTML = '<i class="fas fa-check-circle"></i> 密碼已更新！正在跳轉登入頁...';
        setTimeout(() => (window.location.href = 'login.html'), 2500);
      } catch (err) {
        console.error(err);
        msg.textContent = err.message || '❌ 重設失敗，請重新再試';
        msg.style.color = '#D9534F';
        btn.innerHTML = originalText;
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
