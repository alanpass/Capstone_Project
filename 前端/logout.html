<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>確認登出｜園藝智能助理</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500&family=Noto+Serif+TC:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" />
  
  <style>
    /* --- 基礎變數 --- */
    :root {
      --primary-color: #4A6352; /* 深森林綠 */
      --accent-color: #84A588; /* 鼠尾草綠 */
      --light-bg: #F7F6F2; /* 米白紙質感 */
      --text-dark: #3D3D3D;
      --card-radius: 20px;
      --shadow: 0 10px 30px rgba(74, 99, 82, 0.15);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Noto Sans TC', sans-serif;
      background-color: var(--light-bg);
      color: var(--text-dark);
      width: 100%;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow-x: hidden;
    }

    /* 背景紋理 */
    body::before {
      content: "";
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background-image: url("image/backgroud.jpg");
      background-size: cover;
      background-position: center;
      opacity: 0.1;
      z-index: -5;
    }

    /* 飄落葉子動畫 */
    .falling-leaf {
      position: fixed;
      top: -10%;
      z-index: -2;
      opacity: 0.2;
      color: var(--primary-color);
      animation: fall linear infinite;
      pointer-events: none;
    }

    @keyframes fall {
      0% { transform: translateY(-10vh) rotate(0deg) translateX(0); opacity: 0; }
      20% { opacity: 0.3; }
      100% { transform: translateY(110vh) rotate(360deg) translateX(50px); opacity: 0; }
    }
    .l1 { left: 20%; font-size: 30px; animation-duration: 15s; }
    .l2 { left: 80%; font-size: 25px; animation-duration: 12s; animation-delay: 2s; }

    /* --- Header --- */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 40px;
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(10px);
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 2px 15px rgba(0,0,0,0.05);
    }

    .logo-container {
      display: flex; align-items: center; text-decoration: none;
      color: var(--primary-color); transition: opacity 0.3s;
    }
    .logo-container:hover { opacity: 0.8; }

    .logo { width: 50px; height: 50px; border-radius: 50%; object-fit: cover; }
    
    .logo-text {
      font-family: 'Noto Serif TC', serif;
      font-size: 26px; margin-left: 15px; font-weight: 700;
      letter-spacing: 1px; color: var(--primary-color);
    }

    .nav { display: flex; gap: 35px; align-items: center; }

    .nav-item {
      text-decoration: none; color: var(--text-dark);
      font-size: 16px; font-weight: 500; position: relative;
      transition: color 0.3s;
    }
    .nav-item:hover { color: var(--primary-color); }

    .login-btn {
      background-color: var(--primary-color); color: white; border: none;
      padding: 10px 24px; border-radius: 50px; font-size: 16px;
      cursor: pointer; transition: all 0.3s ease;
      box-shadow: 0 4px 10px rgba(74, 99, 82, 0.3);
    }
    .login-btn:hover {
      background-color: #3a4f41; transform: translateY(-2px);
    }

    /* --- Content Area --- */
    .main-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }

    /* 登出確認卡片 (玻璃擬態) */
    .logout-card {
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(20px);
      border-radius: var(--card-radius);
      padding: 50px 40px;
      width: 100%;
      max-width: 450px;
      box-shadow: var(--shadow);
      border: 1px solid rgba(255, 255, 255, 0.8);
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    /* 頂部裝飾線 */
    .logout-card::before {
      content: "";
      position: absolute;
      top: 0; left: 0; width: 100%; height: 6px;
      background: linear-gradient(90deg, #D9534F, #FF8C00); /* 使用暖色系警示 */
    }

    .confirm-icon {
      font-size: 60px;
      color: var(--primary-color);
      margin-bottom: 20px;
      opacity: 0.8;
    }

    .confirm-text {
      font-family: 'Noto Serif TC', serif;
      font-size: 32px;
      color: var(--primary-color);
      margin-bottom: 15px;
      font-weight: 700;
    }

    .sub-text {
      color: #666;
      font-size: 16px;
      margin-bottom: 40px;
    }

    /* 按鈕群組 */
    .btn-group {
      display: flex;
      gap: 15px;
    }

    .confirm-btn {
      flex: 1;
      background: linear-gradient(135deg, #e74c3c, #c0392b); /* 紅色系表示登出 */
      color: white;
      border: none;
      padding: 15px;
      border-radius: 12px;
      font-size: 18px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.3s;
      box-shadow: 0 5px 15px rgba(231, 76, 60, 0.2);
    }

    .confirm-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(231, 76, 60, 0.3);
    }

    .cancel-btn {
      flex: 1;
      background: white;
      color: var(--text-dark);
      border: 1px solid #ddd;
      padding: 15px;
      border-radius: 12px;
      font-size: 18px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.3s;
    }

    .cancel-btn:hover {
      background: #f5f5f5;
      border-color: #ccc;
    }

    @media (max-width: 768px) {
      .header { flex-direction: column; padding: 15px; gap: 15px; }
      .logout-card { padding: 30px 20px; }
      .btn-group { flex-direction: column; }
    }
  </style>
</head>
<body>
  <i class="fas fa-leaf falling-leaf l1"></i>
  <i class="fas fa-leaf falling-leaf l2"></i>

  <header class="header">
    <a href="firstpage.html" class="logo-container" aria-label="返回首頁">
      <img src="https://placehold.co/60x60/4A6352/white?text=Leaf" alt="Leaf logo" class="logo" />
      <div class="logo-text">園藝智能助理</div>
    </a>
    <nav class="nav">
      <a href="new.html" class="nav-item">開始種植</a>
      <a href="userinfor.html" class="nav-item">使用者資訊</a>
    </nav>
  </header>

  <main class="main-content">
    <div class="logout-card">
      <div class="confirm-icon">
        <i class="fas fa-sign-out-alt"></i>
      </div>
      <h1 class="confirm-text">確認登出？</h1>
      <p class="sub-text">您即將登出系統，下次需要重新登入。</p>
      
      <div class="btn-group">
        <button class="cancel-btn" onclick="history.back()">取消</button>
        <button class="confirm-btn" id="confirmLogout">確認登出</button>
      </div>
    </div>
  </main>

  <script type="module">
    import { doLogout } from './common.js';

    // 頁面頂部導覽列的登出按鈕 (這裡可以移除，或設為直接觸發確認邏輯)
    // 但因為已經在登出確認頁，通常導覽列不放登出，或按下也只是重新整理此頁

    // 主畫面中央「確認登出」按鈕
    const confirmBtn = document.getElementById('confirmLogout');
    
    confirmBtn.addEventListener('click', async (e) => {
      e.preventDefault();
      
      // 按鈕 Loading 狀態
      const originalText = confirmBtn.innerText;
      confirmBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> 登出中...';
      confirmBtn.disabled = true;

      try {
        await doLogout();
        // 登出成功後，給一點緩衝時間讓動畫跑一下
        setTimeout(() => {
          alert('您已安全登出');
          location.href = 'login.html';
        }, 500);
      } catch (err) {
        console.error(err);
        alert(err.message || '登出失敗，請稍後再試');
        confirmBtn.innerText = originalText;
        confirmBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
