<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>智慧種植規劃生成器 | 園藝智能助理</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&family=Noto+Serif+TC:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" />

  <style>
    /* --- 基礎變數 --- */
    :root {
      --primary-color: #4A6352; /* 深森林綠 */
      --accent-color: #84A588; /* 鼠尾草綠 */
      --light-bg: #F7F6F2; /* 米白紙質感 */
      --text-dark: #3D3D3D;
      --card-radius: 20px;
      --shadow: 0 10px 30px rgba(74, 99, 82, 0.15);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Noto Sans TC', sans-serif;
      background-color: var(--light-bg);
      color: var(--text-dark);
      width: 100%;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow-x: hidden;
      font-size: 18px; 
    }

    /* 背景紋理 */
    body::before {
      content: "";
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background-image: url("image/backgroud.jpg");
      background-size: cover;
      background-position: center;
      opacity: 0.1;
      z-index: -5;
    }

    /* 飄落葉子動畫 */
    .falling-leaf {
      position: fixed;
      top: -10%;
      z-index: -2;
      opacity: 0.2;
      color: var(--primary-color);
      animation: fall linear infinite;
      pointer-events: none;
    }

    @keyframes fall {
      0% { transform: translateY(-10vh) rotate(0deg) translateX(0); opacity: 0; }
      20% { opacity: 0.3; }
      100% { transform: translateY(110vh) rotate(360deg) translateX(50px); opacity: 0; }
    }
    .l1 { left: 5%; font-size: 25px; animation-duration: 18s; }
    .l2 { left: 50%; font-size: 30px; animation-duration: 22s; animation-delay: 3s; }
    .l3 { left: 90%; font-size: 20px; animation-duration: 15s; animation-delay: 7s; }

    /* --- Header --- */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 40px;
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(10px);
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 2px 15px rgba(0,0,0,0.05);
    }

    .logo-container {
      display: flex; align-items: center; text-decoration: none;
      color: var(--primary-color); transition: opacity 0.3s;
    }
    .logo-container:hover { opacity: 0.8; }

    .logo { width: 50px; height: 50px; border-radius: 50%; object-fit: cover; }
    
    .logo-text {
      font-family: 'Noto Serif TC', serif;
      font-size: 26px; margin-left: 15px; font-weight: 700;
      letter-spacing: 1px; color: var(--primary-color);
    }

    .nav { display: flex; gap: 35px; align-items: center; }

    .nav-item {
      text-decoration: none; color: var(--text-dark);
      font-size: 18px;
      font-weight: 500; position: relative;
      transition: color 0.3s;
    }
    .nav-item:hover { color: var(--primary-color); }

    #welcome {
      font-size: 16px;
      color: #666;
      font-family: 'Noto Serif TC', serif;
      font-style: italic;
    }

    .login-btn {
      background-color: var(--primary-color); color: white; border: none;
      padding: 8px 20px; border-radius: 50px; font-size: 16px;
      cursor: pointer; transition: all 0.3s ease;
      box-shadow: 0 4px 10px rgba(74, 99, 82, 0.3);
    }
    .login-btn:hover {
      background-color: #3a4f41; transform: translateY(-2px);
    }

    /* --- Content Area --- */
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 30px 20px;
    }

    .container {
      width: 100%;
      max-width: 900px;
    }

    .card {
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(20px);
      border-radius: var(--card-radius);
      padding: 30px;
      box-shadow: var(--shadow);
      border: 1px solid rgba(255, 255, 255, 0.8);
      position: relative;
    }

    .card::before {
      content: "";
      position: absolute;
      top: 0; left: 0; width: 100%; height: 6px;
      background: linear-gradient(90deg, var(--accent-color), var(--primary-color));
    }

    h1 {
      font-family: 'Noto Serif TC', serif;
      color: var(--primary-color);
      margin-bottom: 20px;
      font-size: 30px;
      text-align: center;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .input-group { margin-bottom: 15px; }

    label {
      display: block;
      margin-bottom: 5px;
      font-weight: 500;
      color: #666;
      font-size: 16px;
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-icon {
      position: absolute;
      left: 15px;
      color: var(--accent-color);
      font-size: 20px;
    }

    input {
      width: 100%;
      padding: 12px 12px 12px 45px;
      font-size: 18px;
      border-radius: 10px;
      border: 1px solid #ddd;
      background: #fdfdfd;
      transition: all 0.3s;
      color: var(--text-dark);
      outline: none;
    }

    input:focus {
      border-color: var(--accent-color);
      box-shadow: 0 0 0 3px rgba(132, 165, 136, 0.2);
      background: white;
    }

    input:disabled {
      background: #eee;
      color: #888;
      cursor: not-allowed;
    }

    .btn-group {
      display: flex;
      gap: 15px;
      flex-wrap: wrap;
      margin-top: 10px;
    }

    button {
      flex: 1;
      padding: 12px;
      border-radius: 12px;
      font-size: 18px;
      font-weight: 600;
      border: none;
      cursor: pointer;
      transition: all 0.3s;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      min-width: 200px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
    }

    #startButton {
      background: linear-gradient(135deg, var(--accent-color), var(--primary-color));
      color: white;
    }
    #startButton:hover { transform: translateY(-2px); box-shadow: 0 6px 15px rgba(74, 99, 82, 0.3); }

    #dailyButton {
      background: white;
      color: var(--primary-color);
      border: 1px solid var(--primary-color);
    }
    #dailyButton:hover { background: #f0f7f2; transform: translateY(-2px); }

    /* 歷史查詢按鈕 */
    #historyButton {
      background: #607D8B; 
      color: white;
      margin-top: 10px;
      width: 100%;
    }
    #historyButton:hover { background: #546E7A; transform: translateY(-2px); }

    .tip {
      background: rgba(255, 243, 205, 0.6);
      border-left: 4px solid #ffc107;
      padding: 15px;
      border-radius: 8px;
      margin-top: 20px;
      font-size: 16px;
      color: #856404;
      line-height: 1.4;
    }

    /* Log 視窗 */
    .log {
      margin-top: 25px;
      white-space: pre-wrap;
      background: #2C3E36;
      color: #E0ECD3;
      padding: 20px;
      border-radius: 12px;
      border: 1px solid #4A6352;
      max-height: 500px;
      overflow-y: auto;
      font-size: 16px;
      line-height: 1.6; /* ✅ 增加行高，提升閱讀性 */
      box-shadow: inset 0 2px 10px rgba(0,0,0,0.3);
    }

    .log h3 {
        color: #fff;
        border-bottom: 1px solid #5e7a61;
        padding-bottom: 5px;
        margin-top: 15px;
        font-size: 20px;
    }
    .log h4 { color: #84A588; margin-top: 15px; margin-bottom: 5px; font-size: 18px;}
    .log ul, .log ol { padding-left: 20px; margin-bottom: 10px; }
    .log li { margin-bottom: 8px; /* ✅ 增加列表項目間距 */ }
    
    .log strong { color: #fff; }

    .log::-webkit-scrollbar { width: 8px; }
    .log::-webkit-scrollbar-track { background: #2C3E36; }
    .log::-webkit-scrollbar-thumb { background: #5e7a61; border-radius: 4px; }
    .log.error { border-color: #ff6b6b; background: #3e2c2c; color: #ffcccc; }
    .log.success { border-color: #4CAF50; }

    /* ✅ 歷史查詢與 AI 回覆框專用樣式 (優化排版) */
    .history-box {
        background: #f1f8e9;       
        padding: 20px; /* ✅ 增加內距 */
        border-radius: 10px; 
        color: #333 !important;    
        margin-top: 15px;
        border-left: 5px solid #4CAF50;
        line-height: 1.7; /* ✅ 增加詳細內容的行高 */
    }
    /* 強制將框框內的「粗體字」改為深綠色 */
    .history-box strong {
        color: #1b5e20 !important; 
        font-weight: 700;
    }
    /* 強制標題顏色與間距 */
    .history-box h4 {
        color: #2e7d32 !important;
        border-bottom: 1px solid #ccc;
        padding-bottom: 8px;
        margin-top: 20px;
        margin-bottom: 10px;
        font-size: 19px;
    }
    /* 第一個標題不要上方間距 */
    .history-box h4:first-child { margin-top: 0; }
    
    .history-box ul { margin-bottom: 15px; padding-left: 20px; }
    .history-box li { margin-bottom: 8px; }

    @media (max-width: 768px) {
      .header { flex-direction: column; padding: 15px; gap: 15px; }
      .nav { flex-wrap: wrap; justify-content: center; }
      .card { padding: 25px; }
      .btn-group { flex-direction: column; }
    }
  </style>
</head>
<body>
  <i class="fas fa-leaf falling-leaf l1"></i>
  <i class="fas fa-leaf falling-leaf l2"></i>
  <i class="fas fa-leaf falling-leaf l3"></i>

  <div class="header">
    <a href="firstpage.html" class="logo-container" aria-label="返回首頁">
      <img src="https://placehold.co/60x60/4A6352/white?text=Leaf" alt="Leaf logo" class="logo" />
      <div class="logo-text">園藝智能助理</div>
    </a>
    <div class="nav">
      <a href="new.html" class="nav-item" id="plantingLink">開始種植</a>
      <a href="userinfor.html" class="nav-item">使用者資訊</a>
      <a href="hardware.html" class="nav-item">感測器資訊</a>
      <span id="welcome"></span>
      <button class="login-btn" id="logoutBtn">登出</button>
    </div>
  </div>

  <main>
    <div class="container">
      <div class="card">
        <h1><i class="fas fa-seedling"></i> 智慧種植規劃生成器</h1>

        <div class="input-group" style="display:none;">
          <label for="apiKey">🔑 Gemini API KEY</label>
          <input type="password" id="apiKey" value="YOUR_GEMINI_API_KEY_HERE">
        </div>
        <div class="input-group" style="display:none;">
          <label for="userId">👤 使用者 ID</label>
          <div class="input-wrapper">
            <input type="text" id="userId" placeholder="正在載入..." disabled>
          </div>
        </div>

        <div class="input-group">
          <label for="keyword"> 作物名稱 / 專案切換</label>
          <div class="input-wrapper">
            <i class="fas fa-leaf input-icon"></i>
            <input type="text" id="keyword" placeholder="輸入名稱可「切換植物」或「建立新規劃」 (留空查看最新)">
          </div>
        </div>

        <div class="btn-group">
          <button id="startButton">
            <i class="fas fa-rocket"></i> 首次生成完整規劃
          </button>
          <button id="dailyButton">
            <i class="fas fa-calendar-day"></i> 查看今日計畫
          </button>
        </div>

        <div class="input-group" style="margin-top: 25px; border-top: 1px dashed #ccc; padding-top: 20px;">
          <label for="specificDay"> 查詢特定天數 (針對目前載入的植物)</label>
          <div class="input-wrapper">
            <i class="fas fa-history input-icon"></i>
            <input type="number" id="specificDay" placeholder="輸入天數 (例如: 3)" min="1">
          </div>
          <button id="historyButton">
            <i class="fas fa-search"></i> 查詢該日計畫
          </button>
        </div>

        <div class="tip">
          <i class="fas fa-lightbulb"></i> <strong>使用提示:</strong><br>
          1. <strong>切換專案:</strong> 輸入「番茄」後點擊「查看今日計畫」。<br>
          2. <strong>查看最新:</strong> 清空輸入框後點擊「查看今日計畫」。<br>
          3. <strong>新建專案:</strong> 輸入新名字後點擊「首次生成完整規劃」。<br>
          4. <strong>時光機:</strong> 先載入植物，再於下方輸入天數查詢。
        </div>

        <div class="log" id="log">等待指令中...</div>
      </div>
    </div>
  </main>

  <script type="module">
    import { requireAuth, getMyProfile, doLogout } from './common.js';
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";

    const welcome = document.getElementById('welcome');
    const logoutBtn = document.getElementById('logoutBtn');
    const userIdInput = document.getElementById('userId');

    requireAuth('login.html');
    let currentUserId = null;

    const auth = getAuth();
    onAuthStateChanged(auth, async (user) => {
      if (user) {
        currentUserId = user.uid;
        if(userIdInput) userIdInput.value = user.uid;
        try {
          const profile = await getMyProfile();
          if (profile?.displayName) welcome.textContent = `Hi, ${profile.displayName}`;
          else welcome.textContent = user.email || '使用者';
        } catch (err) {
          welcome.textContent = user.email || '使用者';
        }
        addWelcomeMessage(user);
      } else {
        location.href = 'login.html';
      }
    });

    // ✅ 修正：還原成圖片中的歡迎文字
    function addWelcomeMessage(user) {
      const log = document.getElementById('log');
      if (log && !log.textContent.includes('歡迎使用')) {
        log.innerHTML = `
        <div style="white-space: normal;">
          <h3> 歡迎使用智慧種植規劃系統!</h3>
          <p> <strong>多專案切換功能已啟用:</strong></p>
          <ul>
             <li>若您種了多種植物，請在輸入框輸入名稱來切換。</li>
             <li>若留空，系統預設載入最後一次種植的植物。</li>
          </ul>
        </div>
        `;
      }
    }

    logoutBtn.addEventListener('click', async () => {
      if (confirm('確定要登出嗎?')) {
        await doLogout();
        location.href = 'login.html';
      }
    });

    const urlParams = new URLSearchParams(window.location.search);
    const plantParam = urlParams.get('plant');
    if (plantParam) document.getElementById('keyword').value = plantParam;

    window.getCurrentUserId = () => currentUserId;
  </script>

  <script>
    const CLOUD_RUN_URL = "https://two025-zhuan-ti.onrender.com"; 
    
    const log = document.getElementById('log');
    let lastCheckedDate = null;
    let autoCheckInterval = null;
    let lastPlanData = null; 
    const AUTO_CHECK_INTERVAL_MS = 600000; 

    function addLog(message, type = 'info') {
      let cleanMessage = message.replace(/```html/g, '').replace(/```/g, '');
      const div = document.createElement('div');
      if (cleanMessage.includes('<') && cleanMessage.includes('>')) {
          div.innerHTML = cleanMessage;
          div.style.whiteSpace = 'normal'; 
      } else {
          div.textContent = cleanMessage;
      }
      log.appendChild(div);
      log.scrollTop = log.scrollHeight;
      
      log.classList.remove('error', 'success');
      if (type === 'error') log.classList.add('error');
      else if (type === 'success') log.classList.add('success');
    }
    
    function getCurrentDate() { return new Date().toISOString().split('T')[0]; }
    
    async function callGeminiProxy(prompt, schema = null) {
      try {
        const response = await fetch(`${CLOUD_RUN_URL}/call-gemini-proxy`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ prompt: prompt, structured: !!schema, schema: schema })
        });
        if (!response.ok) {
          const errorText = await response.text();
          throw new Error(errorText || `HTTP 錯誤 ${response.status}`);
        }
        const data = await response.json();
        if (data.error) throw new Error(data.error);
        return data.result || '(無回覆)';
      } catch (error) {
        throw new Error(`AI 呼叫失敗: ${error.message}`);
      }
    }

    // --- 🚀 首次生成 (含智慧單位換算) ---
    // --- 🚀 首次生成 (含植物驗證與智慧單位換算) ---
    async function startProcess() {
      const userId = window.getCurrentUserId();
      const keyword = document.getElementById('keyword').value.trim();
      const button = document.getElementById('startButton');
      
      log.innerHTML = ''; 
      if (!keyword) { alert('請輸入作物名稱'); return; }
      if (!userId) { alert('請重新登入'); return; }

      button.disabled = true;
      button.innerHTML = '<i class="fas fa-spinner fa-spin"></i> 驗證資料中...';

      // =========== ✨ 新增功能：植物名稱驗證 ✨ ===========
      try {
        const validationSchema = {
          type: "OBJECT",
          properties: {
            is_plant: { type: "BOOLEAN" } // 強制 AI 只回傳 true 或 false
          },
          required: ["is_plant"]
        };

        const valPrompt = `
          請判斷「${keyword}」在生物學或園藝上是否屬於「植物」(作物、花卉、蔬果、樹木)。
          
          規則：
          1. 如果是具體的植物名稱 (如: 番茄, 玫瑰, 黃金葛, 蘋果樹) -> 回傳 true。
          2. 如果是非生物、食品料理、動物、虛構名詞 (如: iPhone, 披薩, 鋼鐵人, 貓咪, 太陽) -> 回傳 false。
          3. 如果輸入不明確或查無此物 -> 回傳 false。
        `;

        // 呼叫 API 進行判斷
        const valResult = await callGeminiProxy(valPrompt, validationSchema);

        // 如果 AI 判斷不是植物
        if (valResult && valResult.is_plant === false) {
            addLog(`<p>❌ <strong>查無此資料</strong>：系統識別出「${keyword}」似乎不是植物。</p><p>請輸入正確的農作物或花卉名稱。</p>`, 'error');
            
            // 恢復按鈕並停止執行
            button.disabled = false;
            button.innerHTML = '<i class="fas fa-rocket"></i> 首次生成完整規劃';
            return; // ⛔️ 這裡直接結束函式，不執行後續動作
        }

      } catch (e) {
        console.warn("驗證過程發生錯誤，暫時略過驗證直接嘗試生成:", e);
        // 如果驗證 API 出錯 (例如網路問題)，為了不卡住使用者，我們選擇繼續執行後續動作
      }
      // ===================================================

      button.innerHTML = '<i class="fas fa-spinner fa-spin"></i> 處理中...';
      addLog(`<h3> 正在為「${keyword}」生成規劃...</h3>`, 'info');

      try {
        let info1 = await callGeminiProxy(`請詳細說明 ${keyword} 的生長資訊。`);
        addLog(`<p> <strong>[AI]</strong> 已獲取植物資訊。</p>`);

        let totalDays = 90; // 預設值
        try {
            const durationSchema = { 
                type: "OBJECT", 
                properties: { 
                    value: { type: "NUMBER" },
                    unit: { type: "STRING", enum: ["days", "weeks", "months", "years"] } 
                },
                required: ["value", "unit"]
            };

            const prompt = `
                請判斷「${keyword}」從種植到採收(或第一次開花/結果)所需的最佳時間。
                如果是多年生植物(如灌木、樹木)，請只計算「從種植到第一次成熟/開花」的時間。
                請回傳 value (數字) 與 unit (單位，只能是 days, weeks, months, years 其中之一)。
            `;

            const d = await callGeminiProxy(prompt, durationSchema);
            
            if (d && d.value) {
                let rawValue = Number(d.value);
                let unit = d.unit ? d.unit.toLowerCase() : 'days';
                let multiplier = 1;

                if (unit.includes('year')) multiplier = 365;
                else if (unit.includes('month')) multiplier = 30;
                else if (unit.includes('week')) multiplier = 7;

                let finalDays = rawValue * multiplier;
                console.log(`AI 回傳: ${rawValue} ${unit}, 換算後: ${finalDays} 天`);

                // 保護機制：最少 30 天，最多 365 天
                totalDays = Math.max(30, Math.min(365, Math.ceil(finalDays)));
            }
        } catch(e){
            console.warn("AI 週期判斷失敗，使用預設值 90 天", e);
        }

        addLog(`<p> <strong>[AI]</strong> 建議週期: ${totalDays} 天</p>`);

        const saveRes = await fetch(`${CLOUD_RUN_URL}/save-planting-record`, {
            method: 'POST', headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ user_id: userId, plant_name: keyword, total_days: totalDays })
        });

        if ((await saveRes.json()).success) {
            log.innerHTML = '';
            addLog(`<h3> 種植規劃已建立！</h3><p>週期: ${totalDays} 天</p>`, 'success');
            await getDailyPlan(true); 
        } else {
            addLog('<p> 儲存失敗</p>', 'error');
        }

      } catch (error) {
        addLog(`<p> 錯誤: ${error.message}</p>`, 'error');
      } finally {
        button.disabled = false; 
        button.innerHTML = '<i class="fas fa-rocket"></i> 首次生成完整規劃';
      }
    }

    // --- 📅 查看今日計畫 (升級為詳細版 + 嚴格排版) ---
    async function getDailyPlan(isAutoUpdate = false) {
      const userId = window.getCurrentUserId();
      const button = document.getElementById('dailyButton');
      const currentKeyword = document.getElementById('keyword').value.trim();

      if (!isAutoUpdate) { log.innerHTML = ''; button.disabled = true; button.innerHTML = '<i class="fas fa-spinner fa-spin"></i> 載入中...'; }
      if (!userId) { alert('請重新登入'); return; }

      try {
        if (!isAutoUpdate) {
             if(currentKeyword) addLog(`<h3> 正在讀取「${currentKeyword}」的計畫...</h3>`);
             else addLog('<h3> 正在讀取最新的種植計畫...</h3>');
        }
        
        let apiUrl = `${CLOUD_RUN_URL}/get-daily-plan?user_id=${userId}`;
        if (currentKeyword) {
            apiUrl += `&plant_name=${encodeURIComponent(currentKeyword)}`;
        }
        
        const res = await fetch(apiUrl);
        const data = await res.json();
        if (data.error) throw new Error(data.error);
        
        lastPlanData = data; 
        if (!isAutoUpdate) log.innerHTML = ''; 
        
        if(!currentKeyword) document.getElementById('keyword').value = data.plant_name;

        let basicInfoHtml = `
            <h3>🌱 ${data.plant_name} - 今日概況</h3>
            <ul>
                <li><strong>📅 日期:</strong> ${data.date}</li>
                <li><strong>📊 進度:</strong> 第 ${data.day}/${data.total_days} 天</li>
                <li><strong>📝 階段:</strong> ${data.current_stage}</li>
            </ul>
        `;
        addLog(basicInfoHtml);
        
        // ✅ 升級指令：要求「非常詳細」且「格式化」的內容
        const prompt = `
        你是一位頂尖的植物學家與農業顧問。
        作物: ${data.plant_name}
        目前進度: 第 ${data.day} 天 (階段: ${data.current_stage})
        
        請提供一份【非常詳細且專業】的今日操作指南，必須包含具體的數據（如水量毫升數、肥料名稱比例）以及背後的科學原因。

        請依照以下 HTML 結構輸出 (不要使用 Markdown)：
        1. 使用 <h4>標籤作為區塊標題 (例如：<h4>1. 今日關鍵任務</h4>)。
        2. 使用 <ul> 和 <li> 列點。
        3. 在 <li> 中使用 <strong> 標示重點動作。
        
        內容需求：
        * **今日關鍵任務 (3項)**：每項需包含「具體動作」、「建議數值(如澆水 500ml)」與「執行原因」。
        * **環境監控建議**：針對目前的生長階段，溫度/濕度/光照的具體檢查重點。
        * **專家小提醒**：一個進階的栽培技巧。

        請確保排版清晰，文字量足夠詳細，但請勿在最後添加無意義的結語。
        `;
        const aiRes = await callGeminiProxy(prompt);
        // ✅ 套用 history-box 樣式確保文字清晰
        addLog(`<div class="history-box">${aiRes}</div>`);
        
      } catch (error) {
        addLog(`<p class="error"> 錯誤: ${error.message}</p>`, 'error');
        if(currentKeyword) addLog('<p>請確認該植物是否曾經建立過規劃。</p>');
      } finally {
        if (!isAutoUpdate) { button.disabled = false; button.innerHTML = '<i class="fas fa-calendar-day"></i> 查看今日計畫'; }
      }
    }

    // --- 🔎 查詢特定天數 (升級為詳細版 + 嚴格排版) ---
    const historyBtn = document.getElementById('historyButton');
    historyBtn.addEventListener('click', async () => {
        const day = document.getElementById('specificDay').value;
        if(!day) { alert('請輸入天數'); return; }
        
        historyBtn.disabled = true;
        historyBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> 查詢中...';
        log.innerHTML = '';

        try {
            if (!lastPlanData) {
                await getDailyPlan(true); 
                if (!lastPlanData) throw new Error("請先建立或載入種植專案");
            }

            const plantName = lastPlanData.plant_name;
            addLog(`<h3>🔎 查詢「${plantName}」第 ${day} 天的計畫...</h3>`, 'info');

            // ✅ 升級指令：要求「非常詳細」且「格式化」的內容
            const prompt = `
                使用者正在種植：${plantName}
                查詢【第 ${day} 天】的詳細種植任務。
                
                請模擬當天的生長情境，提供一份【非常詳細且專業】的操作指南。
                請依照以下 HTML 結構輸出 (嚴格禁止 Markdown)：
                
                <h4>1. 預期生長狀態</h4>
                <p>描述植物這一天應該長什麼樣子（如高度、葉片數）。</p>

                <h4>2. 關鍵護理任務</h4>
                <ul>
                    <li><strong>動作名稱：</strong>詳細說明操作步驟、具體用量(如水、肥)以及原因。</li>
                    <li>...請列出至少 3 點...</li>
                </ul>

                <h4>3. 注意事項與風險</h4>
                <ul>
                    <li>列出該階段最容易遇到的病蟲害或環境風險，並提供預防方法。</li>
                </ul>

                請確保內容專業、數據具體，並使用 HTML 標籤排版讓閱讀舒適。
            `;
            const result = await callGeminiProxy(prompt);
            
            // ✅ 使用 CSS class 控制樣式 (文字深綠色)
            addLog(`<div class="history-box">
                <h4>📅 第 ${day} 天 - 專家建議</h4>
                ${result}
            </div>`);

        } catch(e) {
            addLog(`<p>❌ 查詢失敗: ${e.message}</p>`, 'error');
        } finally {
            historyBtn.disabled = false;
            historyBtn.innerHTML = '<i class="fas fa-search"></i> 查詢該日計畫';
        }
    });

    document.getElementById('startButton').addEventListener('click', startProcess);
    document.getElementById('dailyButton').addEventListener('click', () => getDailyPlan(false));
  </script>
</body>
</html>
