<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>園藝智能助理</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500&family=Noto+Serif+TC:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" />
  
  <style>
    /* --- 基礎變數 (維持全站統一) --- */
    :root {
      --primary-color: #4A6352; /* 深森林綠 */
      --accent-color: #84A588; /* 鼠尾草綠 */
      --light-bg: #F7F6F2; /* 米白紙質感 */
      --text-dark: #3D3D3D;
      --card-radius: 20px;
      --shadow: 0 10px 30px rgba(74, 99, 82, 0.15);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Noto Sans TC', sans-serif;
      background-color: var(--light-bg);
      color: var(--text-dark);
      width: 100%;
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
    }

    /* 背景紋理 */
    body::before {
      content: "";
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background-image: url("image/backgroud.jpg");
      background-size: cover;
      background-position: center;
      opacity: 0.1;
      z-index: -5;
    }

    /* 飄落葉子動畫 */
    .falling-leaf {
      position: fixed;
      top: -10%;
      z-index: -2;
      opacity: 0.2;
      color: var(--primary-color);
      animation: fall linear infinite;
      pointer-events: none;
    }

    @keyframes fall {
      0% { transform: translateY(-10vh) rotate(0deg) translateX(0); opacity: 0; }
      20% { opacity: 0.3; }
      100% { transform: translateY(110vh) rotate(360deg) translateX(50px); opacity: 0; }
    }
    .l1 { left: 5%; font-size: 25px; animation-duration: 18s; }
    .l2 { left: 40%; font-size: 30px; animation-duration: 15s; animation-delay: 5s; }
    .l3 { left: 80%; font-size: 20px; animation-duration: 20s; animation-delay: 2s; }

    /* --- Header --- */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 40px;
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(10px);
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 4px 15px rgba(0,0,0,0.05);
    }

    .logo-container {
      display: flex; align-items: center; text-decoration: none;
      color: var(--primary-color);
    }

    .logo { width: 50px; height: 50px; border-radius: 50%; object-fit: cover; }
    
    .logo-text {
      font-family: 'Noto Serif TC', serif;
      font-size: 28px; margin-left: 15px; font-weight: 700;
      letter-spacing: 1px; color: var(--primary-color);
    }

    .nav { display: flex; gap: 20px; align-items: center; }

    /* 按鈕樣式優化 */
    .btn {
      padding: 10px 28px;
      border-radius: 50px;
      font-size: 16px;
      cursor: pointer;
      font-weight: 500;
      transition: all 0.3s ease;
      border: none;
    }

    .register-btn {
      background-color: transparent;
      color: var(--primary-color);
      border: 1px solid var(--primary-color);
    }
    .register-btn:hover {
      background-color: #f0f7f2;
    }

    .login-btn {
      background: linear-gradient(135deg, var(--accent-color), var(--primary-color));
      color: white;
      box-shadow: 0 4px 10px rgba(74, 99, 82, 0.3);
    }
    .login-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 15px rgba(74, 99, 82, 0.4);
    }

    /* --- Hero Banner (主視覺) --- */
    .hero-section {
      position: relative;
      width: 100%;
      height: 450px; /* 增加高度 */
      margin-bottom: 50px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      /* 使用原本的 plant1.jpg 當作背景 */
      background-image: url("image/plant1.jpg");
      background-size: cover;
      background-position: center;
    }

    /* 黑色遮罩，讓文字更清楚 */
    .hero-overlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.3);
    }

    .hero-content {
      position: relative;
      z-index: 2;
      text-align: center;
      color: white;
      padding: 20px;
      animation: fadeIn 1s ease-out;
    }

    .hero-title {
      font-family: 'Noto Serif TC', serif;
      font-size: 48px;
      font-weight: 700;
      margin-bottom: 15px;
      text-shadow: 0 2px 10px rgba(0,0,0,0.5);
    }

    .hero-subtitle {
      font-size: 20px;
      font-weight: 300;
      letter-spacing: 2px;
      opacity: 0.9;
    }

    /* --- Gallery --- */
    .main-content {
      max-width: 1200px;
      margin: 0 auto 60px auto;
      padding: 0 30px;
    }

    .section-title {
      font-family: 'Noto Serif TC', serif;
      font-size: 28px;
      color: var(--primary-color);
      margin-bottom: 30px;
      text-align: center;
      position: relative;
    }
    .section-title::after {
      content: ""; display: block; width: 50px; height: 3px;
      background: var(--accent-color); margin: 10px auto 0;
    }

    .plant-gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 30px;
    }

    .plant-card {
      height: 350px;
      border-radius: var(--card-radius);
      overflow: hidden;
      position: relative;
      background: white;
      box-shadow: var(--shadow);
      /* 移除舊的粗邊框，改用精緻陰影 */
      border: none;
      transition: all 0.4s ease;
    }

    .plant-card:hover {
      transform: translateY(-10px);
      box-shadow: 0 20px 40px rgba(0,0,0,0.15);
    }

    .plant-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.6s ease;
    }

    .plant-card:hover .plant-img {
      transform: scale(1.1); /* 圖片放大特效 */
    }

    /* 動畫 */
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 768px) {
      .header { flex-direction: column; padding: 15px; gap: 15px; }
      .hero-title { font-size: 32px; }
    }
  </style>
</head>
<body>
  <i class="fas fa-leaf falling-leaf l1"></i>
  <i class="fas fa-leaf falling-leaf l2"></i>
  <i class="fas fa-leaf falling-leaf l3"></i>

  <div class="header">
    <div class="logo-container">
      <img src="https://placehold.co/60x60/4A6352/white?text=Leaf" alt="Leaf logo" class="logo" />
      <div class="logo-text">園藝智能助理</div>
    </div>
    <div class="nav">
      <button class="btn register-btn" id="registerBtn">註冊帳號</button>
      <button class="btn login-btn" id="loginBtn">會員登入</button>
    </div>
  </div>

  <div class="hero-section">
    <div class="hero-overlay"></div>
    <div class="hero-content">
      <h1 class="hero-title">擁抱自然生活</h1>
      <p class="hero-subtitle">智能監控，讓種植變得優雅而簡單</p>
    </div>
  </div>

  <div class="main-content">
    <h2 class="section-title">精選植物圖鑑</h2>
    <div class="plant-gallery">
      <div class="plant-card">
        <img src="image/plant2.jpg" alt="Flower1" class="plant-img" />
      </div>
      <div class="plant-card">
        <img src="image/plant3.jpg" alt="Leaves" class="plant-img" />
      </div>
      <div class="plant-card">
        <img src="image/plant4.png" alt="Flowers" class="plant-img" />
      </div>
      <div class="plant-card">
        <img src="image/plant5.jpeg" alt="Flower2" class="plant-img" />
      </div>
    </div>
  </div>

  <script type="module">
    import { checkLoginRedirect } from './common.js';

    document.getElementById('loginBtn').addEventListener('click', () => {
      location.href = 'login.html';
    });
    document.getElementById('registerBtn').addEventListener('click', () => {
      location.href = 'register.html';
    });

    // 若使用者已登入 → 直接導向登入後首頁
    checkLoginRedirect('firstpage.html');
  </script>
</body>
</html>
