<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>園藝智能助理</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500&family=Noto+Serif+TC:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" />
  
  <style>
    /* --- 基礎設定 --- */
    :root {
      --primary-color: #4A6352; /* 深森林綠 */
      --accent-color: #84A588; /* 鼠尾草綠 */
      --light-bg: #F7F6F2; /* 米白紙質感 */
      --text-dark: #3D3D3D;
      --text-light: #FFFFFF;
      --shadow: 0 10px 20px rgba(74, 99, 82, 0.1);
      --card-radius: 20px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      font-family: 'Noto Sans TC', sans-serif;
      background-color: var(--light-bg);
      color: var(--text-dark);
      width: 100%;
      min-height: 100vh;
      position: relative;
      line-height: 1.6;
    }

    /* 背景紋理與裝飾 */
    body::before {
      content: "";
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background-image: url("image/backgroud.jpg"); /* 請確認檔名是否正確 */
      background-size: cover;
      background-position: center;
      opacity: 0.08;
      z-index: -2;
    }

    /* 漸層疊加 */
    body::after {
      content: "";
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: linear-gradient(135deg, rgba(247,246,242,0.8) 0%, rgba(247,246,242,0.4) 100%);
      z-index: -1;
      pointer-events: none;
    }

    /* --- Header 導覽列 --- */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 40px;
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(10px);
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 2px 15px rgba(0,0,0,0.05);
    }

    .logo-container {
      display: flex;
      align-items: center;
      text-decoration: none;
      color: var(--primary-color);
      transition: opacity 0.3s;
    }
    .logo-container:hover { opacity: 0.8; }

    .logo {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      object-fit: cover;
    }

    .logo-text {
      font-family: 'Noto Serif TC', serif;
      font-size: 26px;
      margin-left: 15px;
      font-weight: 700;
      letter-spacing: 1px;
      color: var(--primary-color);
    }

    .nav { display: flex; gap: 35px; align-items: center; }

    .nav-item {
      text-decoration: none;
      color: var(--text-dark);
      font-size: 16px;
      font-weight: 500;
      position: relative;
      transition: color 0.3s;
    }

    .nav-item::after {
      content: '';
      position: absolute;
      width: 0; height: 2px;
      bottom: -5px; left: 0;
      background-color: var(--accent-color);
      transition: width 0.3s;
    }
    .nav-item:hover { color: var(--primary-color); }
    .nav-item:hover::after { width: 100%; }

    #welcome {
      font-size: 16px;
      color: #666;
      font-family: 'Noto Serif TC', serif;
      font-style: italic;
    }

    .login-btn {
      background-color: var(--primary-color);
      color: white;
      border: none;
      padding: 10px 24px;
      border-radius: 50px;
      font-size: 16px;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 4px 10px rgba(74, 99, 82, 0.3);
    }
    .login-btn:hover {
      background-color: #3a4f41;
      transform: translateY(-2px);
      box-shadow: 0 6px 15px rgba(74, 99, 82, 0.4);
    }

    /* --- 主視覺圖片 --- */
    .hero-container {
      padding: 0 40px;
      margin-top: 30px;
    }
    .hero-image {
      width: 100%;
      height: 400px;
      object-fit: cover;
      border-radius: var(--card-radius);
      box-shadow: var(--shadow);
      filter: brightness(0.95) contrast(1.05);
    }

    /* --- 主要內容區 --- */
    .main-content {
      display: flex;
      justify-content: space-between;
      margin: 50px 40px;
      gap: 60px;
      flex-wrap: wrap;
    }

    .search-section { flex: 1; min-width: 320px; }

    .search-title {
      font-family: 'Noto Serif TC', serif;
      font-size: 38px;
      color: var(--primary-color);
      margin-bottom: 20px;
      position: relative;
      display: inline-block;
    }
    
    .search-title::after {
      content: "";
      display: block;
      width: 60px;
      height: 3px;
      background: var(--accent-color);
      margin-top: 10px;
    }

    .search-container { position: relative; margin-bottom: 20px; margin-top: 30px; }

    .full-width-btn {
      width: 100%;
      padding: 18px;
      background: linear-gradient(135deg, var(--accent-color), var(--primary-color));
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 18px;
      font-weight: 500;
      letter-spacing: 1px;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 8px 20px rgba(74, 99, 82, 0.25);
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
    }
    
    .full-width-btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 12px 25px rgba(74, 99, 82, 0.35);
    }
    
    .full-width-btn::before {
      font-family: "Font Awesome 5 Free";
      content: "\f002";
      font-weight: 900;
    }

    .search-description {
      margin-bottom: 40px;
      color: #666;
      font-size: 18px;
      font-weight: 300;
    }

    .button-container { display: flex; gap: 20px; flex-wrap: wrap; }

    .edit-btn {
      background-color: white;
      color: var(--primary-color);
      border: 1px solid var(--accent-color);
      padding: 15px 30px;
      border-radius: 12px;
      font-size: 18px;
      cursor: pointer;
      flex: 1;
      min-width: 140px;
      text-align: center;
      text-decoration: none;
      transition: all 0.3s;
      font-weight: 500;
    }

    .edit-btn:hover {
      background-color: var(--primary-color);
      color: white;
      box-shadow: 0 5px 15px rgba(0,0,0,0.1);
    }

    /* --- Gallery --- */
    .plant-gallery {
      display: flex;
      gap: 20px;
      flex: 1.5;
      min-width: 300px;
      flex-wrap: wrap;
    }

    .plant-card {
      flex: 1;
      min-width: 220px;
      height: 350px;
      border-radius: var(--card-radius);
      overflow: hidden;
      position: relative;
      box-shadow: 0 10px 20px rgba(0,0,0,0.08); 
      transition: all 0.4s ease;
      background: white;
    }

    .plant-card:hover {
      transform: translateY(-10px);
      box-shadow: 0 20px 40px rgba(0,0,0,0.15);
    }

    .plant-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.5s ease;
    }

    .plant-card:hover .plant-img {
      transform: scale(1.05);
    }

    @media (max-width: 768px) {
      .header { flex-direction: column; padding: 15px; gap: 15px; }
      .nav { gap: 15px; flex-wrap: wrap; justify-content: center; }
      .hero-container { padding: 0 20px; }
      .main-content { margin: 30px 20px; flex-direction: column; }
      .plant-card { min-width: 100%; height: 250px; }
    }
  </style>
</head>
<body>
  <div class="header">
    <a href="firstpage.html" class="logo-container" aria-label="返回首頁">
      <img src="https://placehold.co/60x60/4A6352/white?text=Leaf" alt="Leaf logo" class="logo" />
      <div class="logo-text">園藝智能助理</div>
    </a>
    <div class="nav">
      <a href="new.html" class="nav-item" id="plantingLink">開始種植</a>
      <a href="userinfor.html" class="nav-item">使用者資訊</a>
      <a href="hardware.html" class="nav-item">感測器資訊</a>
      <span id="welcome"></span>
      <button class="login-btn" id="logoutBtn">登出</button>
    </div>
  </div>

  <div class="hero-container">
    <img src="image/bigplant.jpg" alt="Green Leaves" class="hero-image" loading="lazy" />
  </div>

  <div class="main-content">
    <div class="search-section">
      <h2 class="search-title">您想要種植什麼?</h2>
      <p class="search-description">探索適合您的綠色夥伴，為生活注入自然氣息。</p>
      
      <div class="search-container">
        <button id="searchPlantsBtn" class="full-width-btn">搜尋植物</button>
      </div>
      
      <div class="button-container">
        <a class="edit-btn" href="demo.html">DEMO</a>
        <a class="edit-btn" href="revise.html">修改資料</a>
      </div>
    </div>

    <div class="plant-gallery">
      <div class="plant-card">
        <img src="image/plant1.jpg" alt="Flower1" class="plant-img" />
      </div>
      <div class="plant-card">
        <img src="image/plant2.jpg" alt="Leaves" class="plant-img" />
      </div>
      <div class="plant-card">
        <img src="image/plant3.jpg" alt="Flowers" class="plant-img" />
      </div>
    </div>
  </div>

  <script type="module">
    import { requireAuth, getMyProfile, doLogout } from './common.js';

    const welcome = document.getElementById('welcome');
    const logoutBtn = document.getElementById('logoutBtn');

    // 登入保護
    requireAuth('login.html');

    // 顯示使用者名稱
    (async () => {
      try {
        const user = await getMyProfile();
        if (user?.displayName) {
          welcome.textContent = `Hi, ${user.displayName}`;
        } else if (user?.email) {
          welcome.textContent = user.email;
        } else {
          welcome.textContent = '使用者';
        }
      } catch (err) {
        console.error(err);
      }
    })();

    // 登出
    logoutBtn.addEventListener('click', async () => {
      await doLogout();
      alert('已登出');
      location.href = 'login.html';
    });

    // 點擊「搜尋植物」跳轉到 plants.html
    document.getElementById('searchPlantsBtn')?.addEventListener('click', () => {
      location.href = 'plants.html';
    });
  </script>
</body>
</html>
