<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>忘記密碼｜園藝智能助理</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500&family=Noto+Serif+TC:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" />
  
  <style>
    /* --- 基礎變數 --- */
    :root {
      --primary-color: #4A6352; /* 深森林綠 */
      --accent-color: #84A588; /* 鼠尾草綠 */
      --light-bg: #F7F6F2; /* 米白紙質感 */
      --text-dark: #3D3D3D;
      --card-radius: 20px;
      --shadow: 0 10px 30px rgba(74, 99, 82, 0.15);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Noto Sans TC', sans-serif;
      background-color: var(--light-bg);
      color: var(--text-dark);
      width: 100%;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow-x: hidden;
    }

    /* 背景紋理 */
    body::before {
      content: "";
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background-image: url("image/backgroud.jpg");
      background-size: cover;
      background-position: center;
      opacity: 0.1;
      z-index: -5;
    }

    /* 飄落葉子動畫 */
    .falling-leaf {
      position: fixed;
      top: -10%;
      z-index: -2;
      opacity: 0.2;
      color: var(--primary-color);
      animation: fall linear infinite;
      pointer-events: none;
    }

    @keyframes fall {
      0% { transform: translateY(-10vh) rotate(0deg) translateX(0); opacity: 0; }
      20% { opacity: 0.3; }
      100% { transform: translateY(110vh) rotate(360deg) translateX(50px); opacity: 0; }
    }
    .l1 { left: 20%; font-size: 30px; animation-duration: 15s; }
    .l2 { left: 70%; font-size: 25px; animation-duration: 20s; animation-delay: 5s; }

    /* --- Header --- */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 40px;
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(10px);
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 2px 15px rgba(0,0,0,0.05);
    }

    .logo-container {
      display: flex; align-items: center; text-decoration: none;
      color: var(--primary-color); transition: opacity 0.3s;
    }
    .logo-container:hover { opacity: 0.8; }

    .logo { width: 50px; height: 50px; border-radius: 50%; object-fit: cover; }
    
    .logo-text {
      font-family: 'Noto Serif TC', serif;
      font-size: 26px; margin-left: 15px; font-weight: 700;
      letter-spacing: 1px; color: var(--primary-color);
    }

    .nav { display: flex; gap: 35px; align-items: center; }

    .nav-item {
      text-decoration: none; color: var(--text-dark);
      font-size: 16px; font-weight: 500; position: relative;
      transition: color 0.3s;
    }
    .nav-item:hover { color: var(--primary-color); }

    /* --- Content Area --- */
    .main-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }

    /* 玻璃擬態卡片 */
    .reset-card {
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(20px);
      border-radius: var(--card-radius);
      padding: 50px 40px;
      width: 100%;
      max-width: 500px;
      box-shadow: var(--shadow);
      border: 1px solid rgba(255, 255, 255, 0.8);
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    /* 頂部裝飾線 */
    .reset-card::before {
      content: "";
      position: absolute;
      top: 0; left: 0; width: 100%; height: 6px;
      background: linear-gradient(90deg, var(--accent-color), var(--primary-color));
    }

    .card-title {
      font-family: 'Noto Serif TC', serif;
      font-size: 28px;
      color: var(--primary-color);
      margin-bottom: 10px;
      font-weight: 700;
    }

    .card-desc {
      color: #666;
      font-size: 15px;
      margin-bottom: 30px;
      line-height: 1.5;
    }

    /* 表單樣式 */
    .login-form { width: 100%; }

    .form-group { margin-bottom: 25px; text-align: left; }

    .form-label {
      display: block;
      font-size: 14px;
      color: #666;
      margin-bottom: 8px;
      font-weight: 500;
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-icon {
      position: absolute;
      left: 15px;
      color: var(--accent-color);
      font-size: 18px;
    }

    .form-input {
      width: 100%;
      padding: 15px 15px 15px 45px;
      font-size: 16px;
      border: 1px solid #ddd;
      border-radius: 12px;
      background: #fdfdfd;
      outline: none;
      transition: all 0.3s;
      color: var(--text-dark);
    }

    .form-input:focus {
      border-color: var(--accent-color);
      box-shadow: 0 0 0 3px rgba(132, 165, 136, 0.2);
      background: white;
    }

    .submit-btn {
      width: 100%;
      background: linear-gradient(135deg, var(--accent-color), var(--primary-color));
      color: white;
      border: none;
      padding: 15px;
      border-radius: 12px;
      font-size: 18px;
      font-weight: 500;
      cursor: pointer;
      margin-top: 10px;
      transition: all 0.3s;
      box-shadow: 0 5px 15px rgba(74, 99, 82, 0.2);
    }

    .submit-btn:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(74, 99, 82, 0.3);
    }
    
    .submit-btn:disabled {
      background: #ccc;
      cursor: wait;
    }

    .msg {
      margin-top: 20px;
      color: var(--primary-color);
      font-weight: 500;
      text-align: center;
      min-height: 24px;
      font-size: 14px;
    }

    .back-link {
      display: block;
      margin-top: 25px;
      color: #888;
      text-decoration: none;
      font-size: 14px;
      transition: color 0.3s;
    }
    .back-link:hover { color: var(--primary-color); text-decoration: underline; }

    @media (max-width: 768px) {
      .header { flex-direction: column; padding: 15px; gap: 15px; }
      .reset-card { padding: 30px 20px; }
    }
  </style>
</head>
<body>
  <i class="fas fa-leaf falling-leaf l1"></i>
  <i class="fas fa-leaf falling-leaf l2"></i>

  <header class="header">
    <a href="firstpagelog.html" class="logo-container" aria-label="返回首頁">
      <img src="https://placehold.co/60x60/4A6352/white?text=Leaf" alt="Leaf logo" class="logo" />
      <div class="logo-text">園藝智能助理</div>
    </a>
    <nav class="nav">
      <a href="firstpagelog.html" class="nav-item">開始種植</a>
      <a href="userinfor.html" class="nav-item">使用者資訊</a>
    </nav>
  </header>

  <main class="main-content">
    <div class="reset-card">
      <h1 class="card-title">重設密碼</h1>
      <p class="card-desc">請輸入您註冊時使用的電子信箱，<br>我們將寄送重設密碼的連結給您。</p>

      <form class="login-form">
        <div class="form-group">
          <label class="form-label">註冊信箱</label>
          <div class="input-wrapper">
            <i class="fas fa-envelope input-icon"></i>
            <input type="email" id="email" class="form-input" placeholder="name@example.com" required />
          </div>
        </div>
        
        <button type="button" class="submit-btn" id="resetBtn">
          寄送重設連結
        </button>

        <div id="msg" class="msg"></div>

        <a href="login.html" class="back-link">
          <i class="fas fa-arrow-left"></i> 返回登入頁面
        </a>
      </form>
    </div>
  </main>

  <script type="module">
    import { resetPassword } from './common.js';

    const btn = document.getElementById('resetBtn');
    const msg = document.getElementById('msg');
    const emailInput = document.getElementById('email');

    btn.addEventListener('click', async (e) => {
      e.preventDefault();
      msg.textContent = '';
      msg.style.color = 'var(--primary-color)';
      
      const email = emailInput.value.trim();
      if (!email) {
        msg.textContent = '⚠ 請輸入註冊信箱';
        msg.style.color = '#D9534F';
        return;
      }

      // 按鈕 loading 狀態
      const originalText = btn.innerHTML;
      btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> 發送中...';
      btn.disabled = true;

      try {
        await resetPassword(email);
        msg.innerHTML = '<i class="fas fa-check-circle"></i> 密碼重設信已寄出，請查看您的信箱';
      } catch (err) {
        console.error(err);
        msg.textContent = err.message || '❌ 寄送失敗，請確認信箱是否正確';
        msg.style.color = '#D9534F';
      } finally {
        // 恢復按鈕
        btn.innerHTML = originalText;
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
