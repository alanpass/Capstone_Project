<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>環境數據｜園藝智能助理</title>
  <meta name="description" content="園藝智能助理：結合 AI 種植規劃、植物百科與 IoT 環境監測的智慧園藝平台。">
  <link rel="icon" href="assets/img/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;700&display=swap">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="assets/css/app.css">
</head>
<body>
<main>
  <div class="page-head row"><div><h1>環境數據</h1><p>ESP32 感測器每分鐘上傳一次溫度、濕度與土壤濕度，頁面每分鐘自動更新。</p></div><span class="spacer"></span>
    <button class="btn secondary" id="refresh"><i class="fa-solid fa-rotate"></i> 重新整理</button></div>
  <div id="source" class="hidden" role="status"></div>
  <section class="card" style="margin-bottom:20px"><h2><i class="fa-solid fa-gauge-high"></i> 最新數值 <span class="badge live">Live</span></h2><div id="latest"></div></section>
  <div class="grid grid-3">
    <section class="card"><h2><i class="fa-solid fa-droplet"></i> 土壤濕度</h2><div class="chart-box"><canvas id="chart-soil" aria-label="土壤濕度圖表"></canvas><p class="chart-empty hidden">沒有資料</p></div></section>
    <section class="card"><h2><i class="fa-solid fa-temperature-half"></i> 空氣溫度</h2><div class="chart-box"><canvas id="chart-temperature" aria-label="空氣溫度圖表"></canvas><p class="chart-empty hidden">沒有資料</p></div></section>
    <section class="card"><h2><i class="fa-solid fa-water"></i> 空氣濕度</h2><div class="chart-box"><canvas id="chart-humidity" aria-label="空氣濕度圖表"></canvas><p class="chart-empty hidden">沒有資料</p></div></section>
  </div>
  <section class="card" style="margin-top:20px"><h2><i class="fa-solid fa-table"></i> 最近紀錄</h2><div class="table-wrap" id="table"></div></section>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.5.1/chart.umd.min.js"></script>
<script type="module" src="assets/js/pages/sensors.js"></script>
</body>
</html>
