<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>自動控制｜園藝智能助理</title>
  <meta name="description" content="園藝智能助理：結合 AI 種植規劃、植物百科與 IoT 環境監測的智慧園藝平台。">
  <link rel="icon" href="assets/img/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;700&display=swap">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="assets/css/app.css">
</head>
<body>
<main>
  <div class="page-head"><h1>自動控制</h1><p>每塊 ESP32 每分鐘同步一次：溫度過高開風扇、過低開加熱，土壤濕度低於門檻自動澆水。你可以為每塊裝置指定要管理哪一株植物，門檻就會隨那株植物的生長階段自動切換；沒指定植物的裝置使用手動門檻。</p></div>
  <div id="msg" class="hidden" role="alert"></div>

  <section class="card" style="margin-bottom:20px">
    <div class="row" style="margin-bottom:12px"><h2 style="margin:0"><i class="fa-solid fa-microchip"></i> 我的裝置</h2><span class="spacer"></span>
      <button class="btn secondary sm" id="addToggle"><i class="fa-solid fa-plus"></i> 新增裝置</button></div>
    <form id="addForm" class="hidden device-add" novalidate>
      <div class="field"><label for="newName">裝置名稱</label><input class="input" id="newName" maxlength="30" placeholder="例如：溫室溫控節點" required></div>
      <div class="field"><label for="newPlant">管理哪一株植物</label><select class="input plant-options" id="newPlant"></select></div>
      <div class="row"><button class="btn" id="addSubmit" type="submit"><i class="fa-solid fa-check"></i> 新增</button>
        <button class="btn ghost" type="button" id="addCancel">取消</button></div>
    </form>
    <div id="devices"></div>
  </section>

  <section class="card" id="planCard" style="margin-bottom:20px">
    <div class="row" style="margin-bottom:12px"><h2 style="margin:0"><i class="fa-solid fa-seedling"></i> 生長計畫門檻</h2><span class="spacer"></span>
      <select class="input" id="plantSelect" aria-label="選擇植物" style="width:auto"></select>
      <button class="btn secondary sm" id="aiSuggest"><i class="fa-solid fa-wand-magic-sparkles"></i> AI 重新建議</button></div>
    <p style="color:var(--muted);font-size:.9rem;margin-bottom:12px">管理這株植物的裝置會依它目前的階段套用對應的門檻。每個階段都可以修改；目前所在的階段會標示出來。要更改植物目前的階段，請到「我的花園」按「調整進度」。</p>
    <div id="planBody"></div>
  </section>

  <section class="card" id="manualCard">
    <h2><i class="fa-solid fa-hand"></i> 手動門檻</h2>
    <p style="color:var(--muted);font-size:.9rem;margin-bottom:12px">沒有指定植物的裝置，以及植物還沒有階段門檻時，使用這組門檻。</p>
    <form id="form" novalidate>
      <h3 style="margin-bottom:12px"><i class="fa-solid fa-temperature-half"></i> 空氣溫度（°C）</h3>
      <div class="grid grid-2" style="gap:12px">
        <div class="field"><label for="tempMin">下限</label><input class="input" id="tempMin" type="number" step="0.5" min="-10" max="50" required></div>
        <div class="field"><label for="tempMax">上限</label><input class="input" id="tempMax" type="number" step="0.5" min="-10" max="50" required></div>
      </div>
      <h3 style="margin:8px 0 12px"><i class="fa-solid fa-droplet"></i> 空氣濕度（%）</h3>
      <div class="grid grid-2" style="gap:12px">
        <div class="field"><label for="humidMin">下限</label><input class="input" id="humidMin" type="number" step="1" min="0" max="100" required></div>
        <div class="field"><label for="humidMax">上限</label><input class="input" id="humidMax" type="number" step="1" min="0" max="100" required></div>
      </div>
      <h3 style="margin:8px 0 12px"><i class="fa-solid fa-faucet-drip"></i> 土壤濕度（%）</h3>
      <div class="field"><label for="soilMin">低於此值自動澆水</label><input class="input" id="soilMin" type="number" step="1" min="0" max="100" required></div>
      <div class="row"><button class="btn" id="submit" type="submit"><i class="fa-solid fa-floppy-disk"></i> 儲存手動門檻</button>
        <button class="btn ghost" type="button" id="defaults">恢復預設值</button>
        <span class="spacer"></span><span id="updated" style="color:var(--muted);font-size:.9rem"></span></div>
    </form>
  </section>
</main>
<script type="module" src="assets/js/pages/device.js"></script>
</body>
</html>
