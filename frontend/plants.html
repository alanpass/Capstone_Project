<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>植物百科｜園藝智能助理</title>
  <meta name="description" content="園藝智能助理：結合 AI 種植規劃、植物百科與 IoT 環境監測的智慧園藝平台。">
  <link rel="icon" href="assets/img/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;700&display=swap">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="assets/css/app.css">
</head>
<body>
<main>
  <div class="page-head"><h1>植物百科 <span id="total" class="badge"></span></h1><p>依用途分類，或用「新手友善」「寵物友善」等條件快速找到適合你的植物。</p></div>
  <div class="cat-chips" id="cats" role="group" aria-label="植物分類"></div>
  <div class="toolbar card" style="padding:16px">
    <div class="field search" style="margin:0"><label for="q">搜尋</label><input class="input" id="q" type="search" placeholder="植物名稱、學名或特色，例如：番茄、驅蚊、耐陰"></div>
    <div class="field" style="margin:0"><label for="sun">日照</label><select class="input" id="sun"><option value="">不限</option>
      <option>全日照</option><option>半日照</option><option>明亮散射光</option><option>耐陰</option></select></div>
    <div class="field" style="margin:0"><label for="sort">排序</label><select class="input" id="sort">
      <option value="default">依分類</option><option value="easy">由好照顧到難</option><option value="name">名稱筆畫</option></select></div>
    <div class="quick-chips" id="quick" role="group" aria-label="快速篩選"></div>
  </div>
  <p id="catDesc" class="cat-desc"></p>
  <p id="shown" class="muted-note" style="margin:0 0 12px"></p>
  <div id="list" class="grid grid-3"></div>
  <div style="text-align:center;margin-top:24px"><button class="btn secondary hidden" id="more"></button></div>
</main>
<script type="module" src="assets/js/pages/plants.js"></script>
</body>
</html>
